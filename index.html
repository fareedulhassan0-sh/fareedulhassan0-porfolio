/** Puts every section in the order chosen in the Page Builder and alternates backgrounds. */
function layoutSections() {
  const main = $('main');
  main.querySelectorAll('section[data-custom]').forEach(s => { if (!customById(s.id)) s.remove(); });
  let alt = false;
  orderList(CFG).forEach(id => {
    let el = document.getElementById(id);
    const cs = customById(id);
    if (cs) {
      if (!el) { el = document.createElement('section'); el.id = id; el.dataset.custom = '1'; el.className = 'sec'; }
      el.innerHTML = `<div class="container">${renderCustom(cs)}</div>`;
    }
    if (!el) return;
    main.appendChild(el);
    const vis = isVisible(id);
    el.style.display = vis ? '' : 'none';
    if (vis && el.classList.contains('sec')) { el.classList.toggle('alt', alt); alt = !alt; }
  });
  $('#home').style.display = show('hero') ? '' : 'none';
}

/* =========================================================
   SOCIAL FEED SECTION (auto-updating posts)
   ========================================================= */
let FEED = {}, feedTab = 'all', feedLimit = 9, feedLoaded = false, feedKey = '', feedIO = null, feedTimer = null;
const feedKeyNow = () => JSON.stringify(feedPlatforms().map(k => [k, CFG.socials.platforms[k]]));
const skeletons = n => `<div class="feed-grid">${'<div class="skel"></div>'.repeat(n)}</div>`;

function renderSocial() {
  const s = CFG.sections.social, links = socialLinks();
  feedLimit = +s.maxItems || 9;
  const tabs = ['all', ...feedPlatforms(), ...(featuredPosts().length ? ['featured'] : [])];
  if (!tabs.includes(feedTab)) feedTab = 'all';
  $('#social-c').innerHTML = head('social') +
    (links.length ? `<div class="follow-row rv">${links.map(l => `<a class="follow" style="--pc:${l.color}" href="${esc(safeUrl(l.url))}" target="_blank" rel="noopener"><i class="${l.icon}"></i>${esc(l.name)}</a>`).join('')}</div>` : '') +
    (tabs.length > 2 ? `<div class="tabs rv">${tabs.map(t => `<button class="tab ${t === feedTab ? 'active' : ''}" data-ft="${t}">${t === 'all' ? 'All' : t === 'featured' ? '<i class="fa-solid fa-thumbtack"></i> Featured' : `<i class="${SOCIAL_PLATFORMS[t].icon}"></i> ${SOCIAL_PLATFORMS[t].name}`}</button>`).join('')}</div>` : '') +
    `<div id="feed-body">${skeletons(Math.min(6, feedLimit))}</div>`;
  armFeed();
}
function armFeed() {
  if (!isVisible('social')) return;
  if (feedLoaded && feedKeyNow() === feedKey) { drawFeed(); return; }
  if (feedIO) feedIO.disconnect();
  const go = () => { clearTimeout(feedTimer); feedTimer = setTimeout(loadFeeds, IS_PREVIEW ? 900 : 0); };
  if (!('IntersectionObserver' in window)) return go();
  feedIO = new IntersectionObserver(en => { if (en.some(e => e.isIntersecting)) { feedIO.disconnect(); go(); } }, { rootMargin: '700px 0px' });
  feedIO.observe($('#social'));
}
async function fetchFeed(k) {
  const P = CFG.socials.platforms[k] || {};
  const ck = 'sfh_feed_' + k + '_' + (P.channelId || P.url || P.pageId || '');
  if (!IS_PREVIEW) { try { const c = JSON.parse(sessionStorage.getItem(ck) || 'null'); if (c && Date.now() - c.t < 600000) return c.items; } catch (e) {} }
  if (!sb) return null;
  try {
    const { data, error } = await sb.functions.invoke(FEED_FUNCTION, { body: { platform: k } });
    if (error || !data || !data.ok) { console.warn(`[social feed] ${k}:`, error ? error.message : data && data.error); return null; }
    try { sessionStorage.setItem(ck, JSON.stringify({ t: Date.now(), items: data.items })); } catch (e) {}
    return data.items;
  } catch (e) { console.warn('[social feed]', e); return null; }
}
async function loadFeeds() {
  const key = feedKeyNow(); feedKey = key;
  const P = CFG.socials.platforms, next = {};
  const api = feedPlatforms().filter(k => k === 'youtube' || k === 'instagram' || (k === 'facebook' && P.facebook.mode === 'api'));
  await Promise.all(api.map(async k => { next[k] = await fetchFeed(k); }));
  if (key !== feedKey) return;
  FEED = next; feedLoaded = true; drawFeed();
}
function feedCard(it, i) {
  const S = SOCIAL_PLATFORMS[it.platform] || {};
  let lb = it.url, kind = 'link';
  if (it.platform === 'youtube') { lb = it.id ? `https://www.youtube.com/watch?v=${it.id}` : it.url; kind = 'auto'; }
  else if (it.type === 'video' && it.media && it.platform === 'instagram') { lb = it.media; kind = 'video'; }
  else if (it.type === 'image' && it.media) { lb = it.media; kind = 'image'; }
  return `<button class="feed-card rv" style="--d:${(i % 6) * st()}s;--pc:${S.color}" data-lb="${esc(lb)}" data-lbk="${kind}" data-cap="${esc(it.title || it.text)}" data-link="${esc(it.url)}">
    <div class="fc-media">${it.thumb ? `<img class="${it.platform === 'youtube' ? 'yt' : ''}" src="${esc(it.thumb)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : `<div class="fc-textonly"><p>${esc(it.text)}</p></div>`}
      ${it.type === 'video' ? PLAY : ''}${it.album ? '<span class="fc-album"><i class="fa-solid fa-clone"></i></span>' : ''}<span class="fc-pl"><i class="${S.icon}"></i></span></div>
    <div class="fc-body">${it.title ? `<h4>${esc(it.title)}</h4>` : it.text ? `<p>${esc(it.text)}</p>` : ''}<small>${fmtDate(it.date)}</small></div></button>`;
}
function featuredCard(p, i) {
  const m = parseMedia(p.url);
  const S = SOCIAL_PLATFORMS[m.pl] || { icon: 'fa-solid fa-thumbtack', color: CFG.theme.primary };
  const thumb = m.thumb || (m.kind === 'image' ? m.src : '');
  return `<button class="feed-card rv" style="--d:${(i % 6) * st()}s;--pc:${S.color}" data-lb="${esc(m.kind === 'link' ? m.url : p.url)}" data-lbk="${m.kind === 'link' ? 'link' : 'auto'}" data-cap="${esc(p.title || p.caption || '')}" data-link="${esc(m.kind === 'iframe' ? m.url : '')}">
    <div class="fc-media">${thumb ? `<img class="${m.pl === 'youtube' ? 'yt' : ''}" src="${esc(thumb)}" alt="" loading="lazy" referrerpolicy="no-referrer">`
      : m.kind === 'video' ? `<video src="${esc(m.src)}#t=0.5" muted playsinline preload="metadata"></video>` : `<div class="fc-textonly"><i class="fa-solid fa-link"></i></div>`}
      ${m.play ? PLAY : ''}<span class="fc-pl"><i class="${S.icon}"></i></span><span class="fc-pin"><i class="fa-solid fa-thumbtack"></i> Featured</span></div>
    ${p.title || p.caption ? `<div class="fc-body">${p.title ? `<h4>${esc(p.title)}</h4>` : ''}${p.caption ? `<p>${esc(p.caption)}</p>` : ''}</div>` : ''}</button>`;
}
function featuredEmbed(p) {
  const m = parseMedia(p.url);
  return `<div class="embed-card rv"><iframe src="${esc(m.src)}" loading="lazy" scrolling="no" allow="encrypted-media; picture-in-picture; fullscreen; clipboard-write" allowfullscreen style="height:${m.h || 560}px"></iframe>
    ${p.title || p.caption ? `<div class="cap">${p.title ? `<b>${esc(p.title)}</b> ` : ''}${esc(p.caption || '')}</div>` : ''}</div>`;
}
function pluginHTML(k) {
  const P = CFG.socials.platforms[k] || {}, S = SOCIAL_PLATFORMS[k];
  const top = `<div class="plug-head"><span class="fc-pl" style="--pc:${S.color}"><i class="${S.icon}"></i></span><b>${S.name}</b>
    ${P.url ? `<a class="follow" style="--pc:${S.color}" href="${esc(safeUrl(P.url))}" target="_blank" rel="noopener">Follow</a>` : ''}</div>`;
  let body = '';
  if (k === 'youtube') {
    const ch = String(P.channelId || '').trim();
    if (/^UC[\w-]{22}$/.test(ch)) body = `<div class="plug-frame wide"><iframe src="https://www.youtube.com/embed/videoseries?list=UU${ch.slice(2)}" loading="lazy" allow="encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div>`;
  }
  if (k === 'facebook' && P.url) body = `<div class="plug-frame fb"><iframe src="https://www.facebook.com/plugins/page.php?href=${encodeURIComponent(safeUrl(P.url))}&tabs=timeline&width=500&height=650&small_header=false&adapt_container_width=true&hide_cover=false&show_facepile=false" loading="lazy" scrolling="no" allow="encrypted-media; clipboard-write"></iframe></div>`;
  if (k === 'tiktok') {
    const u = (String(P.url || '').match(/@([\w.-]+)/) || [])[1];
    if (u) body = `<blockquote class="tiktok-embed" cite="https://www.tiktok.com/@${esc(u)}" data-unique-id="${esc(u)}" data-embed-type="creator" style="max-width:780px;min-width:288px;margin:0"><section><a target="_blank" rel="noopener" href="https://www.tiktok.com/@${esc(u)}?refer=creator_embed">@${esc(u)}</a></section></blockquote>`;
  }
  if (!body) body = `<div class="feed-empty"><i class="${S.icon}" style="color:${S.color}"></i><p>Latest ${S.name} posts will appear here soon.</p></div>`;
  return `<div class="card plug rv">${top}${body}</div>`;
}
function drawFeed() {
  const body = $('#feed-body'); if (!body) return;
  const t = feedTab;
  const plats = t === 'all' ? feedPlatforms() : t === 'featured' ? [] : [t];
  const cards = [], plugs = [];
  plats.forEach(k => { const items = FEED[k]; if (Array.isArray(items) && items.length) cards.push(...items); else plugs.push(k); });
  cards.sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));
  const fCards = [], fEmbeds = [];
  if (t === 'all' || t === 'featured') featuredPosts().forEach(p => { const m = parseMedia(p.url); if (!m) return; (m.kind === 'iframe' && !m.thumb ? fEmbeds : fCards).push(p); });
  const shown = cards.slice(0, feedLimit);
  let h = '';
  if (fCards.length || shown.length) h += `<div class="feed-grid">${fCards.map(featuredCard).join('')}${shown.map((it, i) => feedCard(it, i + fCards.length)).join('')}</div>`;
  if (cards.length > feedLimit) h += `<div class="feed-more"><button class="btn btn-ghost" id="feed-more">Load more <i class="fa-solid fa-chevron-down"></i></button></div>`;
  if (fEmbeds.length) h += `<div class="embeds">${fEmbeds.map(featuredEmbed).join('')}</div>`;
  if (plugs.length) h += `<div class="plug-grid">${plugs.map(pluginHTML).join('')}</div>`;
  if (!h) h = `<div class="feed-empty"><i class="fa-regular fa-images"></i><p>New posts will appear here soon.</p></div>`;
  body.innerHTML = h;
  observeIn(body);
  if (body.querySelector('.tiktok-embed')) {
    document.querySelectorAll('script[data-tt]').forEach(s => s.remove());
    const s = document.createElement('script'); s.src = 'https://www.tiktok.com/embed.js'; s.async = true; s.dataset.tt = '1'; document.body.appendChild(s);
  }
}

/* =========================================================
   LIGHTBOX (photos, videos, YouTube, Instagram…)
   ========================================================= */
function openLB(u, cap, link, kind) {
  const m = kind && kind !== 'auto' ? { kind, src: u, url: link || u } : parseMedia(u);
  if (!m) return;
  if (m.kind === 'link') { const L = link || m.url; if (L) window.open(safeUrl(L), '_blank', 'noopener'); return; }
  let h;
  if (m.kind === 'image') h = `<img src="${esc(m.src)}" alt="" referrerpolicy="no-referrer">`;
  else if (m.kind === 'video') h = `<video src="${esc(m.src)}" controls autoplay playsinline></video>`;
  else h = `<iframe class="${m.h ? 'tall' : ''}" ${m.h ? `style="height:min(${m.h}px,80vh)"` : ''} src="${esc(m.src + (m.pl === 'youtube' ? '&autoplay=1' : m.pl === 'vimeo' ? '?autoplay=1' : ''))}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen; clipboard-write" allowfullscreen></iframe>`;
  $('#lb-media').innerHTML = h;
  $('#lb-cap').textContent = cap || '';
  const L = link || (m.kind === 'iframe' ? m.url : '');
  const a = $('#lb-link'); a.style.display = L ? '' : 'none'; if (L) a.href = safeUrl(L);
  $('#lb').classList.add('open'); document.body.style.overflow = 'hidden';
}
function closeLB() { $('#lb').classList.remove('open'); $('#lb-media').innerHTML = ''; document.body.style.overflow = ''; }
$('#lb').addEventListener('click', e => { if (e.target.id === 'lb' || e.target.classList.contains('lb-box') || e.target.classList.contains('lb-media')) closeLB(); });

/* =========================================================
   ANIMATION ENGINE
   ========================================================= */
let io = null;
function reveal(el, instant) {
  el.classList.add('in');
  if (el.dataset.w !== undefined) el.style.width = el.dataset.w + '%';
  if (el.dataset.count !== undefined) countUp(el, instant);
  const delay = parseFloat(getComputedStyle(el).getPropertyValue('--d')) || 0;
  setTimeout(() => el.style.setProperty('--d', '0s'), (delay + (CFG.animations.speed || .8)) * 1000 + 50);
}
function observeIn(root = document) {
  const els = root.querySelectorAll('.rv:not(.in),[data-w]:not(.in),[data-count]:not(.in)');
  if (!CFG.animations.enabled || !('IntersectionObserver' in window)) { els.forEach(e => reveal(e, true)); return; }
  if (!io) io = new IntersectionObserver(entries => entries.forEach(en => { if (en.isIntersecting) { reveal(en.target); io.unobserve(en.target); } }), { threshold: .12, rootMargin: '0px 0px -40px 0px' });
  els.forEach(e => io.observe(e));
}
function countUp(el, instant) {
  const target = parseFloat(el.dataset.count), dec = (String(el.dataset.count).split('.')[1] || '').length;
  if (instant || isNaN(target)) { el.textContent = el.dataset.count; return; }
  const dur = 1700, t0 = performance.now();
  (function step(t) {
    const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    el.textContent = (target * e).toFixed(dec);
    if (k < 1) requestAnimationFrame(step);
  })(t0);
}
let typerToken = 0;
function startTyper() {
  const el = $('#typer-text'); if (!el) return;
  const my = ++typerToken, roles = (CFG.profile.roles || []).filter(Boolean);
  if (!roles.length) { el.textContent = ''; return; }
  const a = CFG.animations;
  if (!a.enabled || !a.typewriter) { el.textContent = roles.join(' • '); return; }
  let ri = 0, ci = 0, del = false; const sp = +a.typeSpeed || 90;
  (function tick() {
    if (my !== typerToken) return;
    const w = roles[ri % roles.length];
    ci += del ? -1 : 1; el.textContent = w.slice(0, ci);
    let t = del ? sp / 2 : sp;
    if (!del && ci >= w.length) { t = 1800; del = true; }
    else if (del && ci <= 0) { del = false; ri++; t = 350; }
    setTimeout(tick, t);
  })();
}
/* Particles */
const cv = $('#particles'), ctx = cv.getContext('2d');
let parts = [], raf = null;
function sizeCanvas() { cv.width = innerWidth; cv.height = innerHeight; }
function initParticles() {
  cancelAnimationFrame(raf);
  const a = CFG.animations;
  if (!a.enabled || !a.particles || matchMedia('(prefers-reduced-motion: reduce)').matches) { cv.style.display = 'none'; return; }
  cv.style.display = 'block'; sizeCanvas();
  const n = Math.min(160, +a.particleCount || 60) * (innerWidth < 700 ? .5 : 1);
  parts = Array.from({ length: n }, () => ({ x: Math.random() * cv.width, y: Math.random() * cv.height, vx: (Math.random() - .5) * .45, vy: (Math.random() - .5) * .45, r: Math.random() * 1.8 + .6 }));
  loop();
}
function loop() {
  ctx.clearRect(0, 0, cv.width, cv.height);
  const col = CFG.theme.primary;
  ctx.fillStyle = hexToRgba(col, .7);
  for (const p of parts) {
    p.x += p.vx; p.y += p.vy;
    if (p.x < 0) p.x = cv.width; if (p.x > cv.width) p.x = 0;
    if (p.y < 0) p.y = cv.height; if (p.y > cv.height) p.y = 0;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
  }
  for (let i = 0; i < parts.length; i++) for (let j = i + 1; j < parts.length; j++) {
    const a = parts[i], b = parts[j], dx = a.x - b.x, dy = a.y - b.y, d = Math.sqrt(dx * dx + dy * dy);
    if (d < 120) { ctx.strokeStyle = hexToRgba(col, (1 - d / 120) * .22); ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
  }
  raf = requestAnimationFrame(loop);
}
function bindCards() {
  document.querySelectorAll('.card').forEach(c => {
    c.onmousemove = e => {
      const r = c.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
      c.style.setProperty('--mx', x + 'px'); c.style.setProperty('--my', y + 'px');
      if (CFG.animations.enabled && CFG.animations.tilt && c.classList.contains('tilt') && c.classList.contains('in') && matchMedia('(pointer:fine)').matches) {
        const rx = ((y / r.height) - .5) * -8, ry = ((x / r.width) - .5) * 8;
        c.style.transform = `perspective(900px) rotateX(${rx}deg) rotateY(${ry}deg) translateY(-4px)`;
      }
    };
    c.onmouseleave = () => { c.style.transform = ''; };
  });
}

/* =========================================================
   MAIN RENDER
   ========================================================= */
function render() {
  document.title = CFG.seo.title;
  $('#meta-desc').setAttribute('content', CFG.seo.description);
  applyTheme(); applyAnim();
  renderNav(); renderHero(); renderMarquee(); renderStats(); renderAbout(); renderServices();
  renderSkills(); renderExperience(); renderEducation(); renderHighlights(); renderContact(); renderFooter(); renderFloat(); buildCV();
  layoutSections();
  renderSocial();
  observeIn(); startTyper(); initParticles(); bindCards(); onScroll();
}

/* =========================================================
   INTERACTIONS
   ========================================================= */
$('#skills-c').addEventListener('click', e => {
  const b = e.target.closest('.tab'); if (!b) return;
  skillFilter = b.dataset.cat;
  document.querySelectorAll('#skills-c .tab').forEach(t => t.classList.toggle('active', t === b));
  const g = $('#skills-grid'); g.innerHTML = skillBars(); observeIn(g);
});
document.addEventListener('click', e => {
  const ft = e.target.closest('[data-ft]');
  if (ft) {
    feedTab = ft.dataset.ft; feedLimit = +CFG.sections.social.maxItems || 9;
    document.querySelectorAll('[data-ft]').forEach(b => b.classList.toggle('active', b === ft));
    if (feedLoaded) drawFeed();
    return;
  }
  if (e.target.closest('#feed-more')) { feedLimit += (+CFG.sections.social.maxItems || 9); drawFeed(); return; }
  const lb = e.target.closest('[data-lb]');
  if (lb) { e.preventDefault(); openLB(lb.dataset.lb, lb.dataset.cap, lb.dataset.link, lb.dataset.lbk); }
});
$('#menu-btn').onclick = () => $('#mobile-menu').classList.toggle('open');
$('#mobile-menu').addEventListener('click', e => { if (e.target.closest('a')) $('#mobile-menu').classList.remove('open'); });
$('#toTop').onclick = () => scrollTo({ top: 0, behavior: 'smooth' });
function onScroll() {
  const y = scrollY, h = document.documentElement.scrollHeight - innerHeight;
  $('#nav').classList.toggle('scrolled', y > 30);
  $('#progress').style.width = (h > 0 ? y / h * 100 : 0) + '%';
  $('#toTop').classList.toggle('show', y > 600);
  let cur = 'home';
  document.querySelectorAll('main > section').forEach(s => { if (s.style.display !== 'none' && s.offsetTop - 140 <= y) cur = s.id; });
  document.querySelectorAll('#nav-links a').forEach(a => a.classList.toggle('active', a.dataset.sec === cur));
}
addEventListener('scroll', onScroll, { passive: true });
addEventListener('resize', () => { if (cv.style.display !== 'none') sizeCanvas(); });
addEventListener('mousemove', e => { const g = $('#cursor-glow'); g.style.left = e.clientX + 'px'; g.style.top = e.clientY + 'px'; }, { passive: true });

function openCV() {
  const u = CFG.profile.cvUrl;
  if (u) { window.open(safeUrl(u), '_blank', 'noopener'); return; }
  buildCV(); $('#cv-modal').classList.add('open'); document.body.style.overflow = 'hidden';
}
function closeCV() { $('#cv-modal').classList.remove('open'); document.body.style.overflow = ''; }
$('#cv-modal').addEventListener('click', e => { if (e.target.id === 'cv-modal') closeCV(); });
addEventListener('keydown', e => { if (e.key === 'Escape') { closeCV(); closeLB(); } });

/* =========================================================
   CONTACT FORM → SUPABASE + GMAIL
   ========================================================= */
function setStatus(type, html) { const s = $('#cf-status'); s.className = 'status show ' + type; s.innerHTML = html; }
async function submitContact(e) {
  e.preventDefault();
  const f = e.target, el = n => f.elements[n];
  if (el('cf_website').value) return; // spam bot
  const payload = {
    name: el('cf_name').value.trim(), email: el('cf_email').value.trim(),
    phone: el('cf_phone').value.trim(), service: el('cf_service').value, message: el('cf_message').value.trim()
  };
  if (!payload.name || !payload.message || !/^\S+@\S+\.\S+$/.test(payload.email)) { setStatus('warn', 'Please fill in your name, a valid email and your message.'); return; }
  if (IS_PREVIEW) { setStatus('info', 'Preview mode — form submissions are disabled here.'); return; }
  const C = CFG.contact, btn = $('#cf-submit');
  btn.disabled = true; btn.querySelector('span').textContent = 'Sending...';
  let saved = false, mailed = false;

  if (C.saveToSupabase && sb) {
    try { const { error } = await sb.from('contact_messages').insert([payload]); if (!error) saved = true; else console.warn(error.message); }
    catch (x) { console.warn(x); }
  }
  if (C.sendGmail && C.gmailTo) {
    try {
      const r = await fetch('https://formsubmit.co/ajax/' + encodeURIComponent(C.gmailTo), {
        method: 'POST', headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({ _subject: `New Portfolio Inquiry: ${payload.service} from ${payload.name}`, _template: 'table', _captcha: 'false', _replyto: payload.email,
          Name: payload.name, Email: payload.email, Phone: payload.phone || 'Not provided', Service: payload.service, Message: payload.message })
      });
      const j = await r.json().catch(() => ({}));
      mailed = r.ok && String(j.success) !== 'false';
    } catch (x) { console.warn(x); }
  }
  btn.disabled = false; btn.querySelector('span').textContent = 'Send Message';

  if (saved || mailed) { setStatus('ok', '✅ ' + esc(C.successMsg)); f.reset(); }
  else {
    setStatus('warn', 'Could not send automatically — opening Gmail so you can send it directly.');
    const body = `Name: ${payload.name}\nEmail: ${payload.email}\nPhone: ${payload.phone}\nService: ${payload.service}\n\n${payload.message}`;
    window.open(`https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(C.gmailTo || CFG.profile.email)}&su=${encodeURIComponent('Portfolio Inquiry: ' + payload.service)}&body=${encodeURIComponent(body)}`, '_blank');
  }
}
function sendWhatsApp() {
  const f = $('#contact-form'), el = n => f.elements[n].value.trim();
  const text = `Assalam-o-Alaikum ${CFG.profile.firstName} ${CFG.profile.lastName},\n\n*Name:* ${el('cf_name') || 'Visitor'}\n*Inquiry:* ${el('cf_service')}\n*Message:* ${el('cf_message') || 'I would like to connect with you.'}`;
  window.open(`https://wa.me/${CFG.profile.whatsapp.replace(/\D/g, '')}?text=${encodeURIComponent(text)}`, '_blank');
}

/* =========================================================
   BOOT: render cached → fetch live settings from Supabase
   ========================================================= */
render();
function hidePreloader() { setTimeout(() => $('#preloader').classList.add('hide'), 500); }
if (!CFG.animations.preloader || !CFG.animations.enabled || IS_PREVIEW) $('#preloader').classList.add('hide');
else if (document.readyState === 'complete') hidePreloader(); else addEventListener('load', hidePreloader);
setTimeout(() => $('#preloader').classList.add('hide'), 4000); // safety net

if (IS_PREVIEW) {
  addEventListener('message', e => {
    if (e.source !== window.parent || !e.data || e.data.type !== 'sfh-preview') return;
    CFG = merge(DEFAULTS, e.data.config); render();
  });
  window.parent.postMessage({ type: 'sfh-ready' }, '*');
} else if (sb) {
  sb.from('site_settings').select('data').eq('id', SETTINGS_ID).maybeSingle().then(({ data, error }) => {
    if (error) { console.warn('Settings not loaded:', error.message); return; }
    if (data && data.data) {
      const fresh = JSON.stringify(data.data);
      if (fresh !== JSON.stringify(readCache())) { writeCache(data.data); CFG = merge(DEFAULTS, data.data); render(); }
    }
  });
}
