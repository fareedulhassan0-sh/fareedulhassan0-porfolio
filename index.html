<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Syed Fareed Ul Hassan | Career Expert & Physics Educator</title>
  <meta name="description" id="meta-desc" content="Portfolio of Syed Fareed Ul Hassan — Career Expert, Physics Educator and Online Instructor based in Sargodha, Punjab, Pakistan." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link id="gfonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="site-config.js"></script>

  <style>
    :root{
      --primary:#ff5500; --secondary:#ff9900; --bg:#060609; --bg2:#0c0c12; --card:#13131c;
      --text:#f3f4f6; --muted:#9ca3af; --radius:18px; --glow:40px;
      --font-h:'Outfit',sans-serif; --font-b:'Inter',sans-serif; --speed:.8s;
      --border:color-mix(in srgb,var(--text) 10%,transparent);
      --p10:color-mix(in srgb,var(--primary) 10%,transparent);
      --p20:color-mix(in srgb,var(--primary) 20%,transparent);
      --p40:color-mix(in srgb,var(--primary) 40%,transparent);
      --p60:color-mix(in srgb,var(--primary) 60%,transparent);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{background:var(--bg);color:var(--text);font-family:var(--font-b);line-height:1.6;overflow-x:hidden;-webkit-font-smoothing:antialiased}
    a{color:inherit;text-decoration:none}
    img{max-width:100%;display:block}
    button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
    input,select,textarea{font:inherit}
    ::selection{background:var(--primary);color:#fff}
    ::-webkit-scrollbar{width:8px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:linear-gradient(var(--primary),var(--secondary));border-radius:9px}
    .container{max-width:1200px;margin:0 auto;padding:0 20px}
    h1,h2,h3,h4{font-family:var(--font-h);line-height:1.15}
    .grad{background:linear-gradient(90deg,var(--primary),var(--secondary));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}

    /* ===== Background FX ===== */
    #particles{position:fixed;inset:0;z-index:0;pointer-events:none}
    .ambient{position:fixed;border-radius:50%;filter:blur(130px);pointer-events:none;z-index:0;opacity:.5}
    .ambient.a1{width:420px;height:420px;background:var(--p20);top:-120px;right:-120px}
    .ambient.a2{width:380px;height:380px;background:color-mix(in srgb,var(--secondary) 15%,transparent);bottom:-80px;left:-120px}
    .cursor-glow{position:fixed;width:420px;height:420px;border-radius:50%;pointer-events:none;z-index:1;background:radial-gradient(circle,var(--p10),transparent 65%);transform:translate(-50%,-50%);left:-500px;top:-500px;transition:opacity .3s}
    #progress{position:fixed;top:0;left:0;height:3px;width:0;z-index:200;background:linear-gradient(90deg,var(--primary),var(--secondary));box-shadow:0 0 12px var(--primary)}
    main,footer,.nav{position:relative;z-index:2}

    /* ===== Preloader ===== */
    #preloader{position:fixed;inset:0;z-index:999;background:var(--bg);display:grid;place-items:center;transition:opacity .6s,visibility .6s}
    #preloader.hide{opacity:0;visibility:hidden}
    .pl-logo{width:78px;height:78px;border-radius:22px;background:linear-gradient(135deg,var(--primary),var(--secondary));display:grid;place-items:center;font-family:var(--font-h);font-weight:900;font-size:34px;color:#fff;animation:plPulse 1.2s ease-in-out infinite;box-shadow:0 0 50px var(--p60)}
    .pl-bar{width:140px;height:3px;border-radius:3px;background:var(--border);margin:22px auto 0;overflow:hidden}
    .pl-bar i{display:block;height:100%;width:40%;background:var(--primary);animation:plBar 1s ease-in-out infinite}
    @keyframes plPulse{50%{transform:scale(1.08) rotate(6deg)}}
    @keyframes plBar{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}

    /* ===== Buttons ===== */
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:14px 28px;border-radius:999px;font-weight:700;font-size:15px;transition:transform .3s,box-shadow .3s,filter .3s,border-color .3s,background .3s}
    .btn-primary{background:linear-gradient(90deg,var(--primary),var(--secondary));color:#fff;box-shadow:0 10px var(--glow) -10px var(--p60)}
    .btn-primary:hover{transform:translateY(-3px);filter:brightness(1.08);box-shadow:0 16px calc(var(--glow) + 10px) -8px var(--p60)}
    .btn-ghost{border:1px solid var(--p40);background:color-mix(in srgb,var(--text) 4%,transparent)}
    .btn-ghost:hover{border-color:var(--primary);transform:translateY(-3px)}
    .btn-ghost i{color:var(--primary)}

    /* ===== Navbar ===== */
    .nav{position:fixed;top:0;left:0;right:0;z-index:100;padding:18px 0;transition:padding .3s,background .3s,border-color .3s;border-bottom:1px solid transparent}
    .nav.scrolled{background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-color:var(--border);padding:11px 0}
    .nav .container{display:flex;align-items:center;justify-content:space-between;gap:20px}
    .brand{display:flex;align-items:center;gap:10px;font-family:var(--font-h);font-weight:800;font-size:22px;letter-spacing:-.01em}
    .logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--primary),var(--secondary));display:grid;place-items:center;color:#fff;font-weight:900;box-shadow:0 6px 20px -4px var(--p60)}
    .brand b{color:var(--primary)}
    .nav-links{display:flex;gap:26px;font-size:14px;font-weight:500;color:var(--muted)}
    .nav-links a{position:relative;transition:color .25s}
    .nav-links a:hover,.nav-links a.active{color:var(--text)}
    .nav-links a::after{content:'';position:absolute;left:0;bottom:-6px;height:2px;width:0;border-radius:2px;background:var(--primary);transition:width .3s}
    .nav-links a:hover::after,.nav-links a.active::after{width:100%}
    .nav-cta{padding:10px 22px;font-size:14px}
    .menu-btn{display:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--border);place-items:center;font-size:18px}
    .mobile-menu{position:fixed;top:72px;left:16px;right:16px;z-index:99;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px;display:none;flex-direction:column;gap:4px;box-shadow:0 30px 60px rgba(0,0,0,.45)}
    .mobile-menu.open{display:flex;animation:dropIn .3s ease}
    .mobile-menu a{padding:10px 12px;border-radius:10px;font-weight:500}
    .mobile-menu a:hover{background:var(--p10);color:var(--primary)}
    @keyframes dropIn{from{opacity:0;transform:translateY(-10px)}}
    @media(max-width:960px){.nav-links,.nav .nav-cta{display:none}.menu-btn{display:grid}}

    /* ===== Hero ===== */
    .hero{min-height:100vh;display:flex;align-items:center;padding:130px 0 80px;position:relative}
    .hero-grid{display:grid;grid-template-columns:1.15fr 1fr;gap:50px;align-items:center}
    .pill{display:inline-flex;align-items:center;gap:10px;padding:7px 16px;border-radius:999px;background:var(--p10);border:1px solid var(--p40);color:var(--primary);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
    .pill .dot{width:8px;height:8px;border-radius:50%;background:var(--primary);animation:pulse 2s infinite}
    @keyframes pulse{0%{box-shadow:0 0 0 0 var(--p60)}70%{box-shadow:0 0 0 10px transparent}100%{box-shadow:0 0 0 0 transparent}}
    .hello{color:var(--muted);letter-spacing:.25em;text-transform:uppercase;font-size:14px;font-weight:600;margin-top:24px}
    .hero h1{font-size:clamp(38px,6.2vw,74px);font-weight:900;letter-spacing:-.02em;margin:8px 0 14px}
    .typer{font-family:var(--font-h);font-size:clamp(20px,2.6vw,30px);font-weight:700;color:var(--primary);min-height:1.45em}
    .caret{display:inline-block;width:3px;height:1em;background:var(--primary);margin-left:4px;vertical-align:-3px;animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .intro{color:var(--muted);font-size:17px;max-width:600px;margin:18px 0 32px}
    .hero-actions{display:flex;flex-wrap:wrap;gap:14px}
    .socials{display:flex;align-items:center;gap:12px;margin-top:34px;flex-wrap:wrap}
    .socials .lbl{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:600}
    .social{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--p60);color:var(--primary);background:var(--p10);transition:all .3s}
    .social:hover{background:var(--pc,var(--primary));border-color:var(--pc,var(--primary));color:#fff;transform:translateY(-4px);box-shadow:0 10px 24px -6px var(--p60)}
    .avatar-wrap{position:relative;width:min(420px,82vw);aspect-ratio:1;margin:0 auto}
    .orbit{position:absolute;inset:0;border-radius:50%;border:1.5px dashed var(--p40);animation:spin 26s linear infinite}
    .orbit.o2{inset:7%;border-style:solid;border-color:var(--p20);animation-duration:18s;animation-direction:reverse}
    .orbit .el{position:absolute;width:14px;height:14px;border-radius:50%;background:var(--primary);box-shadow:0 0 18px var(--primary);top:-7px;left:calc(50% - 7px)}
    .orbit.o2 .el{background:var(--secondary);box-shadow:0 0 16px var(--secondary);top:auto;bottom:-6px;width:12px;height:12px;left:calc(50% - 6px)}
    @keyframes spin{to{transform:rotate(360deg)}}
    .avatar{position:absolute;inset:14%;border-radius:50%;overflow:hidden;display:grid;place-items:center;
      background:radial-gradient(circle at 50% 38%,var(--secondary),var(--primary) 55%,color-mix(in srgb,var(--primary) 45%,#000) 100%);
      box-shadow:0 0 var(--glow) var(--p60),0 0 calc(var(--glow)*2.6) var(--p20),inset 0 0 35px rgba(255,200,0,.35);
      border:3px solid color-mix(in srgb,var(--secondary) 70%,transparent);animation:float 6s ease-in-out infinite}
    .avatar img{width:100%;height:100%;object-fit:cover;object-position:top}
    .monogram{font-family:var(--font-h);font-weight:900;font-size:clamp(52px,8vw,92px);color:#fff;text-shadow:0 6px 30px rgba(0,0,0,.35);letter-spacing:.04em}
    .float-card{position:absolute;z-index:3;background:color-mix(in srgb,var(--card) 92%,transparent);border:1px solid var(--p40);backdrop-filter:blur(10px);border-radius:16px;padding:12px 16px;box-shadow:0 20px 40px rgba(0,0,0,.4);display:flex;align-items:center;gap:10px;animation:float 5s ease-in-out infinite}
    .fc1{right:0;bottom:10%}.fc2{left:-2%;top:12%;animation-delay:-2.5s;border-radius:999px;padding:9px 16px}
    .fc1 .num{font-family:var(--font-h);font-size:26px;font-weight:900;color:var(--primary);line-height:1}
    .fc1 small{display:block;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;line-height:1.3}
    .fc2 i{color:var(--primary);animation:spin 4s linear infinite}
    .fc2 span{font-size:13px;font-weight:600}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
    .scroll-hint{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);width:26px;height:42px;border:2px solid var(--border);border-radius:20px}
    .scroll-hint::after{content:'';position:absolute;left:50%;top:8px;width:4px;height:8px;margin-left:-2px;border-radius:2px;background:var(--primary);animation:scrollDot 1.6s infinite}
    @keyframes scrollDot{0%{opacity:0;transform:translateY(0)}40%{opacity:1}100%{opacity:0;transform:translateY(14px)}}
    @media(max-width:960px){.hero-grid{grid-template-columns:1fr;text-align:center}.hero-visual{order:-1}.intro{margin-left:auto;margin-right:auto}.hero-actions,.socials{justify-content:center}.scroll-hint{display:none}}

    /* ===== Marquee ===== */
    .marquee{border-block:1px solid var(--border);background:var(--bg2);overflow:hidden;padding:18px 0;position:relative;z-index:2}
    .marquee-track{display:flex;width:max-content;animation:marq var(--mq,30s) linear infinite}
    .marquee:hover .marquee-track{animation-play-state:paused}
    .marquee span{font-family:var(--font-h);font-weight:700;font-size:clamp(16px,2vw,22px);white-space:nowrap;color:var(--muted);display:flex;align-items:center;gap:40px;padding-right:40px}
    .marquee span::after{content:'✦';color:var(--primary)}
    @keyframes marq{to{transform:translateX(-50%)}}

    /* ===== Sections ===== */
    .sec{padding:100px 0;position:relative}
    .sec.alt{background:color-mix(in srgb,var(--bg2) 80%,transparent);border-block:1px solid var(--border)}
    .sec-head{text-align:center;max-width:700px;margin:0 auto 60px}
    .kicker{color:var(--primary);font-size:12px;font-weight:800;letter-spacing:.25em;text-transform:uppercase}
    .sec-head h2{font-size:clamp(30px,4.6vw,50px);font-weight:800;margin-top:10px;letter-spacing:-.01em}
    .sec-head p{color:var(--muted);margin-top:14px}
    .bar-line{width:70px;height:4px;border-radius:4px;margin:18px auto 0;background:linear-gradient(90deg,var(--primary),var(--secondary))}

    /* ===== Card ===== */
    .card{background:linear-gradient(145deg,color-mix(in srgb,var(--card) 96%,transparent),color-mix(in srgb,var(--bg) 92%,transparent));border:1px solid var(--border);border-radius:var(--radius);padding:28px;position:relative;overflow:hidden}
    .card::before{content:'';position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .4s;background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),var(--p10),transparent 45%)}
    .card:hover::before{opacity:1}
    .card:hover{border-color:var(--p60);box-shadow:0 22px 45px -18px var(--p40)}
    .lift:hover{transform:translateY(-6px)}
    .icon-box{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;font-size:24px;color:var(--primary);background:var(--p10);border:1px solid var(--p40);transition:all .35s}
    .card:hover .icon-box{background:var(--primary);color:#fff;transform:rotate(-6deg) scale(1.06);box-shadow:0 10px 25px -6px var(--p60)}
    .chip{display:inline-block;padding:5px 14px;border-radius:999px;font-size:12px;font-weight:700;background:var(--p10);color:var(--primary);border:1px solid var(--p40)}
    .chip.solid{background:var(--primary);color:#fff;border-color:var(--primary)}

    /* ===== Stats ===== */
    .stats{padding:60px 0;position:relative;z-index:2}
    .stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
    .stat{text-align:center;padding:26px 18px}
    .stat > i{font-size:22px;color:var(--primary);margin-bottom:10px}
    .stat-num{font-family:var(--font-h);font-size:clamp(32px,4vw,46px);font-weight:900;line-height:1}
    .stat-num b{color:var(--primary)}
    .stat p{color:var(--muted);font-size:13.5px;margin-top:8px;font-weight:500}
    @media(max-width:800px){.stats-grid{grid-template-columns:repeat(2,1fr)}}

    /* ===== About ===== */
    .about-grid{display:grid;grid-template-columns:5fr 7fr;gap:60px;align-items:center}
    .about-photo{position:relative;width:min(320px,75vw);aspect-ratio:1;margin:0 auto}
    .about-photo .avatar{inset:0;animation:none}
    .about-photo .orb{position:absolute;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--secondary));z-index:3;box-shadow:0 0 25px var(--p60)}
    .about-photo .orb.b1{width:48px;height:48px;top:-6px;left:-6px;animation:float 4s ease-in-out infinite}
    .about-photo .orb.b2{width:34px;height:34px;bottom:20px;right:-8px;animation:float 5s ease-in-out infinite reverse}
    .about-tag{display:inline-block;padding:6px 14px;border-radius:999px;background:var(--p10);border:1px solid var(--p40);color:var(--primary);font-size:12px;font-weight:700}
    .about-text h3{font-size:clamp(22px,2.6vw,32px);font-weight:700;margin:16px 0}
    .about-text p{color:var(--muted);margin-bottom:14px}
    .info-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin:24px 0}
    .info{display:flex;align-items:center;gap:14px;padding:16px}
    .info .ib{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex-shrink:0;color:var(--primary);background:var(--p10);border:1px solid var(--p40)}
    .info small{display:block;color:var(--muted);font-size:12px}
    .info strong{font-size:14px;font-weight:600;word-break:break-word}
    .btn-row{display:flex;flex-wrap:wrap;gap:14px}
    @media(max-width:900px){.about-grid{grid-template-columns:1fr;gap:40px}.info-grid{grid-template-columns:1fr}}

    /* ===== Services ===== */
    .services-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:22px}
    .service{display:flex;flex-direction:column}
    .service h3{font-size:20px;margin:22px 0 10px}
    .service p{color:var(--muted);font-size:14.5px;flex:1}
    .service .foot{display:flex;align-items:center;justify-content:space-between;margin-top:22px;padding-top:18px;border-top:1px solid var(--border);font-size:12.5px;font-weight:600;color:var(--primary)}
    .service .go{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;font-size:12px;transition:transform .3s}
    .service:hover .go{transform:rotate(-45deg)}
    .service .num-bg{position:absolute;right:18px;top:8px;font-family:var(--font-h);font-weight:900;font-size:64px;color:var(--text);opacity:.04;line-height:1}

    /* ===== Skills ===== */
    .tabs{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-bottom:34px}
    .tab{padding:9px 20px;border-radius:999px;font-size:13.5px;font-weight:600;border:1px solid var(--border);background:color-mix(in srgb,var(--text) 4%,transparent);color:var(--muted);transition:all .3s}
    .tab:hover{color:var(--text);border-color:var(--p40)}
    .tab.active{background:linear-gradient(90deg,var(--primary),var(--secondary));color:#fff;border-color:transparent;box-shadow:0 8px 22px -8px var(--p60)}
    .skills-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:26px 50px}
    .skill-top{display:flex;justify-content:space-between;font-size:14px;font-weight:700;margin-bottom:10px;gap:12px}
    .skill-top b{color:var(--primary)}
    .track{height:10px;border-radius:99px;background:color-mix(in srgb,var(--text) 8%,transparent);overflow:hidden}
    .fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--primary),var(--secondary));box-shadow:0 0 14px var(--p60);transition:width 1.5s cubic-bezier(.2,.8,.2,1);position:relative;overflow:hidden}
    .fill::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);transform:translateX(-100%);animation:shine 2.4s infinite}
    @keyframes shine{to{transform:translateX(100%)}}
    .skill-cloud{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:34px}
    .skill-cloud span{padding:8px 16px;border-radius:12px;background:var(--card);border:1px solid var(--border);font-size:13px;font-weight:500;transition:all .3s}
    .skill-cloud span:hover{border-color:var(--primary);color:var(--primary);transform:translateY(-3px)}
    @media(max-width:800px){.skills-grid{grid-template-columns:1fr}}

    /* ===== Timeline ===== */
    .timeline{position:relative;max-width:1040px;margin:0 auto}
    .timeline::before{content:'';position:absolute;left:50%;top:0;bottom:0;width:2px;transform:translateX(-50%);background:linear-gradient(var(--primary),var(--p20) 80%,transparent)}
    .t-item{position:relative;width:50%;padding:0 44px 40px 0}
    .t-item:nth-child(even){margin-left:50%;padding:0 0 40px 44px}
    .t-item .dot{position:absolute;top:30px;right:-9px;width:18px;height:18px;border-radius:50%;background:var(--bg);border:3px solid var(--primary);z-index:2}
    .t-item .dot.live{background:var(--primary);box-shadow:0 0 0 5px var(--p20),0 0 20px var(--primary)}
    .t-item:nth-child(even) .dot{right:auto;left:-9px}
    .t-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
    .t-type{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
    .t-type i{color:var(--primary);margin-right:4px}
    .t-item h3{font-size:21px}
    .company{color:var(--primary);font-weight:600;font-size:14.5px;margin:4px 0 14px}
    .checks{list-style:none;display:grid;gap:9px}
    .checks li{display:flex;gap:10px;color:var(--muted);font-size:14.5px}
    .checks i{color:var(--primary);margin-top:5px;font-size:12px}
    @media(max-width:820px){.timeline::before{left:9px}.t-item,.t-item:nth-child(even){width:100%;margin-left:0;padding:0 0 28px 40px}.t-item .dot,.t-item:nth-child(even) .dot{left:0;right:auto}}

    /* ===== Education ===== */
    .edu-grid{display:grid;grid-template-columns:7fr 5fr;gap:34px}
    .col-title{display:flex;align-items:center;gap:12px;font-size:22px;margin-bottom:20px}
    .col-title span{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;font-size:16px}
    .stack{display:grid;gap:18px}
    .edu .meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:10px;font-size:12.5px;color:var(--muted)}
    .edu h4{font-size:19px}
    .edu .inst{color:var(--primary);font-weight:600;font-size:14px;margin-top:4px}
    .edu p.d{color:var(--muted);font-size:14px;margin-top:8px}
    .cert{border-left:4px solid var(--primary)}
    .cert .ct{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
    .cert .ct .icon-box{width:46px;height:46px;font-size:18px;border-radius:12px}
    .cv-card{text-align:center;background:linear-gradient(140deg,var(--p20),var(--card) 55%);border-color:var(--p40)}
    .cv-card > i{font-size:32px;color:var(--primary)}
    .cv-card h4{margin:12px 0 6px;font-size:18px}
    .cv-card p{color:var(--muted);font-size:13px;margin-bottom:16px}
    @media(max-width:900px){.edu-grid{grid-template-columns:1fr}}

    /* ===== Highlights ===== */
    .hl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px}
    .hl h4{font-size:19px;margin:20px 0 10px}
    .hl p{color:var(--muted);font-size:14.5px}

    /* ===== Contact ===== */
    .contact-grid{display:grid;grid-template-columns:5fr 7fr;gap:34px}
    .c-info{display:flex;gap:16px;align-items:flex-start;padding:22px;margin-bottom:16px}
    .c-info .ib{width:50px;height:50px;border-radius:14px;flex-shrink:0;display:grid;place-items:center;background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;font-size:18px}
    .c-info h4{font-size:16px}
    .c-info small{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}
    .c-info a,.c-info strong{font-size:14px;font-weight:600;word-break:break-all}
    .c-info a{color:var(--primary)}
    .wa-chip{display:inline-flex;align-items:center;gap:6px;margin-left:8px;padding:3px 10px;border-radius:99px;font-size:12px;background:rgba(16,185,129,.15);color:#34d399!important;border:1px solid rgba(16,185,129,.35)}
    .form-card{padding:34px}
    .form-card h3{font-size:24px}
    .form-card > p{color:var(--muted);font-size:14px;margin:6px 0 22px}
    .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .fg{margin-bottom:16px}
    .fg label{display:block;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:8px}
    .fg input,.fg select,.fg textarea{width:100%;padding:13px 16px;border-radius:12px;background:color-mix(in srgb,var(--bg) 90%,transparent);border:1px solid var(--border);color:var(--text);font-size:14px;transition:border-color .3s,box-shadow .3s;outline:none}
    .fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--primary);box-shadow:0 0 0 4px var(--p10)}
    .fg select option{background:var(--card)}
    .hp{position:absolute;left:-9999px;opacity:0}
    .f-actions{display:flex;flex-wrap:wrap;gap:12px}
    .f-actions .btn{flex:1;min-width:200px;border-radius:12px}
    .btn-wa{background:#059669;color:#fff}.btn-wa:hover{background:#10b981;transform:translateY(-3px)}
    .status{display:none;margin-top:16px;padding:14px 16px;border-radius:12px;font-size:14px}
    .status.show{display:block;animation:dropIn .3s}
    .status.ok{background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.4);color:#6ee7b7}
    .status.warn{background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.4);color:#fcd34d}
    .status.info{background:var(--p10);border:1px solid var(--p40);color:var(--primary)}
    @media(max-width:900px){.contact-grid{grid-template-columns:1fr}.fgrid{grid-template-columns:1fr}.form-card{padding:24px}}

    /* ===== Footer ===== */
    footer{border-top:1px solid var(--border);background:var(--bg);padding:48px 0 30px}
    .f-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:24px}
    .f-brand p{color:var(--muted);font-size:12.5px}
    .f-links{display:flex;flex-wrap:wrap;gap:20px;font-size:13px;color:var(--muted)}
    .f-links a:hover{color:var(--primary)}
    .f-social{display:flex;flex-wrap:wrap;gap:10px}
    .f-social a{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--text) 6%,transparent);transition:all .3s}
    .f-social a:hover{background:var(--pc,var(--primary));color:#fff}
    .copy{text-align:center;color:var(--muted);font-size:12.5px;margin-top:30px;padding-top:22px;border-top:1px solid var(--border)}

    #toTop{position:fixed;right:22px;bottom:22px;z-index:90;width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;box-shadow:0 10px 25px -6px var(--p60);opacity:0;visibility:hidden;transform:translateY(20px);transition:all .35s}
    #toTop.show{opacity:1;visibility:visible;transform:none}

    /* ===== CV Modal ===== */
    #cv-modal{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.8);backdrop-filter:blur(8px);overflow-y:auto;padding:24px;display:none}
    #cv-modal.open{display:block;animation:dropIn .3s}
    .cv-bar{max-width:860px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--card);border:1px solid var(--border);border-radius:16px 16px 0 0;padding:14px 18px}
    .cv-bar b{font-family:var(--font-h)}
    .cv-bar .btn{padding:9px 18px;font-size:13px}
    .cv-sheet{max-width:860px;margin:0 auto 40px;background:#fff;color:#111827;padding:48px;border-radius:0 0 16px 16px;font-family:'Inter',sans-serif;font-size:13.5px;line-height:1.55}
    .cv-sheet h1{font-size:28px;letter-spacing:.02em;text-transform:uppercase;font-family:'Inter',sans-serif;font-weight:800}
    .cv-sheet .cv-role{color:#c2410c;font-weight:700;text-transform:uppercase;font-size:12.5px;letter-spacing:.08em;margin-top:4px}
    .cv-head{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;border-bottom:2px solid #111827;padding-bottom:18px;margin-bottom:18px}
    .cv-contact{font-size:12px;color:#374151;text-align:right}
    .cv-sheet h2{font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;border-bottom:1px solid #d1d5db;padding-bottom:4px;margin:20px 0 10px;font-family:'Inter',sans-serif}
    .cv-row{display:flex;justify-content:space-between;gap:12px;font-weight:700}
    .cv-sheet ul{padding-left:18px;color:#374151;margin:4px 0 12px}
    .cv-sheet p{color:#374151}
    .cv-comp{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 14px;color:#1f2937}
    @media(max-width:640px){.cv-sheet{padding:24px}.cv-contact{text-align:left}.cv-comp{grid-template-columns:1fr 1fr}}
    @media print{
      body>*:not(#cv-modal){display:none!important}
      #cv-modal{position:static;display:block!important;background:none;padding:0;backdrop-filter:none}
      .cv-bar{display:none!important}
      .cv-sheet{margin:0;max-width:none;border-radius:0;padding:0}
      body{background:#fff}
    }


    .hero,main,footer{overflow-x:clip}
    /* ===== Social: follow chips, feed, floating bar ===== */
    [data-lb]{cursor:zoom-in}
    .follow-row{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:-26px 0 30px}
    .follow{display:inline-flex;align-items:center;gap:9px;padding:9px 17px;border-radius:999px;border:1px solid color-mix(in srgb,var(--pc) 45%,transparent);background:color-mix(in srgb,var(--pc) 10%,transparent);font-size:13.5px;font-weight:600;transition:all .3s}
    .follow i{color:var(--pc);transition:color .3s}
    .follow:hover{background:var(--pc);border-color:var(--pc);color:#fff;transform:translateY(-3px);box-shadow:0 10px 22px -8px var(--pc)}
    .follow:hover i{color:#fff}
    .tab i{margin-right:4px}
    .feed-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
    @media(max-width:900px){.feed-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:540px){.feed-grid{grid-template-columns:1fr}}
    .feed-card{display:flex;flex-direction:column;text-align:left;width:100%;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:transform .4s,border-color .4s,box-shadow .4s,opacity var(--speed),filter var(--speed)}
    .feed-card:hover{transform:translateY(-6px);border-color:var(--p60);box-shadow:0 22px 44px -20px var(--p40)}
    .fc-media{position:relative;aspect-ratio:16/10;overflow:hidden;background:var(--bg2)}
    .fc-media img,.fc-media video{width:100%;height:100%;object-fit:cover;display:block;transition:transform .7s cubic-bezier(.2,.7,.2,1)}
    .fc-media img.yt{transform:scale(1.12)}
    .feed-card:hover .fc-media img{transform:scale(1.08)}
    .feed-card:hover .fc-media img.yt{transform:scale(1.2)}
    .fc-play{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
    .fc-play i{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;padding-left:4px;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);color:#fff;font-size:19px;border:2px solid rgba(255,255,255,.75);transition:all .35s}
    .feed-card:hover .fc-play i,.gal-item:hover .fc-play i,.proj:hover .fc-play i{background:var(--primary);border-color:var(--primary);transform:scale(1.12)}
    .fc-pl{position:absolute;top:12px;left:12px;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--pc,var(--primary));color:#fff;font-size:15px;box-shadow:0 6px 16px rgba(0,0,0,.35);z-index:2}
    .fc-album{position:absolute;top:14px;right:14px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.6)}
    .fc-pin{position:absolute;top:14px;right:12px;padding:4px 10px;border-radius:99px;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);color:#fff;font-size:11px;font-weight:700;z-index:2}
    .fc-textonly{width:100%;height:100%;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,var(--p20),var(--card));color:var(--muted);font-size:28px}
    .fc-textonly p{font-size:14px;color:var(--text);display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
    .fc-body{padding:14px 16px 16px}
    .fc-body h4{font-size:15.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .fc-body p{color:var(--muted);font-size:13.5px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
    .fc-body small{display:block;color:var(--muted);font-size:11.5px;margin-top:8px;opacity:.85}
    .skel{border-radius:var(--radius);aspect-ratio:16/12;background:linear-gradient(90deg,var(--card) 25%,color-mix(in srgb,var(--text) 7%,var(--card)) 50%,var(--card) 75%);background-size:200% 100%;animation:skel 1.4s linear infinite}
    @keyframes skel{to{background-position:-200% 0}}
    .feed-more{text-align:center;margin-top:30px}
    .feed-empty{text-align:center;color:var(--muted);padding:34px 20px}
    .feed-empty i{font-size:34px;display:block;margin-bottom:10px;opacity:.85}
    .embeds{columns:3 320px;column-gap:20px;margin-top:22px}
    .embed-card{break-inside:avoid;margin-bottom:20px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:10px;overflow:hidden}
    .embed-card iframe{width:100%;border:0;display:block;border-radius:10px;background:#fff}
    .embed-card .cap{padding:10px 6px 4px;font-size:13px;color:var(--muted)}
    .plug-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:20px;margin-top:22px;align-items:start}
    .plug{padding:16px}
    .plug-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
    .plug-head .fc-pl{position:static;box-shadow:none}
    .plug-head b{flex:1;font-family:var(--font-h);font-size:16px}
    .plug-head .follow{padding:6px 14px;font-size:12.5px}
    .plug-frame iframe{width:100%;border:0;border-radius:12px;display:block}
    .plug-frame.wide iframe{aspect-ratio:16/9}
    .plug-frame.fb{display:flex;justify-content:center}
    .plug-frame.fb iframe{height:650px;max-width:500px;background:#fff}
    .mini-social{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
    .c-info .mini-social a{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:15px;background:color-mix(in srgb,var(--pc) 15%,transparent);color:var(--pc);transition:all .25s}
    .c-info .mini-social a:hover{background:var(--pc);color:#fff;transform:translateY(-3px)}
    #float-social{position:fixed;left:18px;top:50%;transform:translateY(-50%);z-index:80;display:flex;flex-direction:column;gap:10px}
    #float-social a{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--card) 88%,transparent);border:1px solid var(--border);backdrop-filter:blur(8px);transition:all .3s}
    #float-social a:hover{background:var(--pc);border-color:var(--pc);color:#fff;transform:translateX(5px)}
    @media(max-width:1100px){#float-social{display:none!important}}

    /* ===== Lightbox ===== */
    #lb{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.9);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;padding:20px}
    #lb.open{display:flex;animation:dropIn .3s}
    .lb-box{width:min(980px,100%);max-height:100%;display:flex;flex-direction:column;gap:14px}
    .lb-media{display:flex;justify-content:center}
    .lb-media img,.lb-media video{max-width:100%;max-height:78vh;border-radius:12px;display:block}
    .lb-media iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px;background:#000}
    .lb-media iframe.tall{aspect-ratio:auto;max-width:540px;background:#fff}
    .lb-bar{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap;color:#e5e7eb}
    .lb-bar p{font-size:14px;flex:1;min-width:200px;max-height:4.8em;overflow:auto}
    #lb .btn-ghost{color:#fff;border-color:rgba(255,255,255,.35);padding:10px 18px;font-size:13px}
    .lb-close{position:absolute;top:16px;right:16px;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;font-size:18px;z-index:2;transition:background .25s}
    .lb-close:hover{background:var(--primary)}

    /* ===== Custom sections (Page Builder) ===== */
    .cs-grid{display:grid;gap:22px}
    .cs-grid.c1{grid-template-columns:1fr}.cs-grid.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
    .cs-grid.c3{grid-template-columns:repeat(3,minmax(0,1fr))}.cs-grid.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
    .cs-grid.gal{gap:14px}
    @media(max-width:900px){.cs-grid.c3,.cs-grid.c4{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:600px){.cs-grid.c2,.cs-grid.c3,.cs-grid.c4{grid-template-columns:1fr}.cs-grid.gal.c2,.cs-grid.gal.c3,.cs-grid.gal.c4{grid-template-columns:repeat(2,minmax(0,1fr))}}
    .proj{padding:0;display:flex;flex-direction:column}
    .proj-img{aspect-ratio:16/10;overflow:hidden;background:var(--bg2);position:relative}
    .proj-img img,.proj-img video,.proj-img iframe{width:100%;height:100%;object-fit:cover;border:0;display:block;transition:transform .7s cubic-bezier(.2,.7,.2,1)}
    .proj-img img.yt{transform:scale(1.12)}
    .proj:hover .proj-img img{transform:scale(1.07)}
    .proj-body{padding:22px;display:flex;flex-direction:column;flex:1}
    .proj-body .meta{font-size:11.5px;color:var(--primary);font-weight:800;text-transform:uppercase;letter-spacing:.1em}
    .proj-body h3{font-size:20px;margin:6px 0 10px}
    .proj-body p{color:var(--muted);font-size:14.5px;flex:1}
    .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
    .tags span{font-size:11.5px;padding:4px 10px;border-radius:99px;background:var(--p10);color:var(--primary);border:1px solid var(--p20);font-weight:600}
    .link-btn{display:inline-flex;align-items:center;gap:8px;margin-top:16px;font-weight:700;font-size:13.5px;color:var(--primary)}
    .link-btn i{transition:transform .3s}.link-btn:hover i{transform:translateX(5px)}
    .ach{text-align:center;display:flex;flex-direction:column;align-items:center}
    .ach .val{font-family:var(--font-h);font-size:42px;font-weight:900;margin-top:16px;line-height:1}
    .ach h4{font-size:18px;margin:12px 0 4px}
    .ach .sub2{color:var(--primary);font-size:12.5px;font-weight:700}
    .ach p{color:var(--muted);font-size:14px;margin-top:8px}
    .ach .badge-img{width:78px;height:78px;object-fit:contain;border-radius:14px}
    .feat-row{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center;margin-bottom:80px}
    .feat-row:last-child{margin-bottom:0}
    .feat-row.no-media{grid-template-columns:1fr;max-width:760px;margin-left:auto;margin-right:auto;text-align:center}
    .feat-row:nth-child(even) .feat-media{order:2}
    .feat-media{border-radius:var(--radius);overflow:hidden;border:1px solid var(--border);box-shadow:0 30px 60px -30px var(--p40);aspect-ratio:4/3;background:var(--bg2)}
    .feat-media.tall{aspect-ratio:auto;background:#fff}
    .feat-media img,.feat-media video,.feat-media iframe{width:100%;height:100%;object-fit:cover;border:0;display:block;transition:transform .8s}
    .feat-media:hover img{transform:scale(1.04)}
    .feat-text .kicker{display:block;margin-bottom:10px}
    .feat-text h3{font-size:clamp(24px,3vw,36px);margin-bottom:14px}
    .feat-text .md{margin-bottom:22px}
    @media(max-width:860px){.feat-row{grid-template-columns:1fr;gap:26px;margin-bottom:56px}.feat-row:nth-child(even) .feat-media{order:0}}
    .gal-item{position:relative;border-radius:var(--radius);overflow:hidden;aspect-ratio:1;background:var(--bg2);border:1px solid var(--border)}
    .gal-item img,.gal-item video{width:100%;height:100%;object-fit:cover;display:block;transition:transform .7s cubic-bezier(.2,.7,.2,1)}
    .gal-item img.yt{transform:scale(1.35)}
    .gal-item:hover img{transform:scale(1.09)}
    .gal-item .cap{position:absolute;left:0;right:0;bottom:0;padding:34px 14px 12px;background:linear-gradient(transparent,rgba(0,0,0,.82));color:#fff;font-size:13px;font-weight:600;transform:translateY(100%);transition:transform .35s}
    .gal-item:hover .cap{transform:none}
    .vid-card{padding:0}
    .vid-frame{aspect-ratio:16/9;background:#000}
    .vid-frame.tall{aspect-ratio:auto;background:#fff}
    .vid-frame iframe,.vid-frame video{width:100%;height:100%;border:0;display:block}
    .vid-card .vb{padding:16px 18px}
    .vid-card h4{font-size:16px}
    .vid-card p{color:var(--muted);font-size:13.5px;margin-top:4px}
    .t-text{color:var(--muted);font-size:14.5px;margin-top:8px}
    .testi{display:flex;flex-direction:column}
    .testi .q{font-size:30px;color:var(--primary);line-height:1;opacity:.7}
    .testi p.t{font-size:15px;flex:1;margin:10px 0 22px;font-style:italic;opacity:.9}
    .stars{color:#fbbf24;font-size:13px;margin-top:10px;letter-spacing:2px}
    .who{display:flex;align-items:center;gap:12px}
    .who .av{width:46px;height:46px;border-radius:50%;overflow:hidden;flex-shrink:0;background:linear-gradient(135deg,var(--primary),var(--secondary));display:grid;place-items:center;color:#fff;font-weight:800}
    .who .av img{width:100%;height:100%;object-fit:cover}
    .who b{display:block;font-size:14.5px}.who small{color:var(--muted);font-size:12.5px}
    .faq{max-width:860px;margin:0 auto;display:grid;gap:12px}
    .faq details{background:var(--card);border:1px solid var(--border);border-radius:14px;transition:border-color .3s,opacity var(--speed),transform var(--speed)}
    .faq details[open]{border-color:var(--p60)}

    .faq summary i{color:var(--primary);transition:transform .3s}
    .faq details[open] summary i{transform:rotate(45deg)}
    .faq .ans{padding:0 22px 18px}

    .md p,.md ul{margin-bottom:14px}.md p:last-child,.md ul:last-child{margin-bottom:0}
    .md strong{color:var(--text)}.md a{color:var(--primary);text-decoration:underline}
    .md ul{padding-left:20px}.md li{margin-bottom:6px}
    .md h3{color:var(--text);font-size:22px;margin:18px 0 10px}
    .cs-text{display:grid;grid-template-columns:1fr;gap:46px;align-items:center;max-width:860px;margin:0 auto}
    .cs-text.has-img{grid-template-columns:1.15fr 1fr;max-width:none}
    @media(max-width:860px){.cs-text.has-img{grid-template-columns:1fr}}
    .cta-band{position:relative;overflow:hidden;border-radius:calc(var(--radius) + 8px);padding:clamp(36px,6vw,70px) clamp(22px,5vw,60px);text-align:center;background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;box-shadow:0 30px 70px -30px var(--p60)}
    .cta-band::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 15% 20%,rgba(255,255,255,.25),transparent 40%),radial-gradient(circle at 85% 90%,rgba(0,0,0,.22),transparent 50%);pointer-events:none}
    .cta-band > *{position:relative}
    .cta-band .kicker{color:#fff;opacity:.85}
    .cta-band h2{font-size:clamp(28px,4.4vw,48px);font-weight:900;margin-top:6px}
    .cta-band p{opacity:.92;max-width:640px;margin:14px auto 0;font-size:17px}
    .cta-band .btn-row{margin-top:28px}
    .btn-white{background:#fff;color:#111;box-shadow:0 14px 30px -10px rgba(0,0,0,.4)}.btn-white:hover{transform:translateY(-3px)}
    .btn-outline-w{border:2px solid rgba(255,255,255,.85);color:#fff}.btn-outline-w:hover{background:rgba(255,255,255,.14);transform:translateY(-3px)}
    .logos{display:flex;flex-wrap:wrap;justify-content:center;gap:18px}
    .logo-item{width:170px;height:96px;display:grid;place-items:center;padding:18px;background:var(--card);border:1px solid var(--border);border-radius:14px;transition:border-color .35s,transform .35s,opacity var(--speed)}
    .logo-item img{max-width:100%;max-height:100%;object-fit:contain;filter:grayscale(1);opacity:.75;transition:all .35s}
    .logo-item:hover{border-color:var(--p60);transform:translateY(-4px)}
    .logo-item:hover img{filter:none;opacity:1}
    .logo-item span{font-weight:700;color:var(--muted);text-align:center}

    /* ===== Reveal animations ===== */
    .rv{transition:opacity var(--speed) cubic-bezier(.2,.7,.2,1),transform var(--speed) cubic-bezier(.2,.7,.2,1),filter var(--speed),border-color .4s,box-shadow .4s;transition-delay:var(--d,0s)}
    .card:not(.rv){transition:transform .4s,border-color .4s,box-shadow .4s}
    body[data-anim="fade-up"] .rv:not(.in){opacity:0;transform:translateY(42px)}
    body[data-anim="fade"] .rv:not(.in){opacity:0}
    body[data-anim="zoom"] .rv:not(.in){opacity:0;transform:scale(.86)}
    body[data-anim="slide-left"] .rv:not(.in){opacity:0;transform:translateX(-60px)}
    body[data-anim="slide-right"] .rv:not(.in){opacity:0;transform:translateX(60px)}
    body[data-anim="flip"] .rv:not(.in){opacity:0;transform:perspective(900px) rotateX(22deg) translateY(30px)}
    body[data-anim="blur"] .rv:not(.in){opacity:0;filter:blur(14px);transform:scale(1.04)}
    body.no-anim .rv{opacity:1!important;transform:none!important;filter:none!important;transition:none!important}
    body.no-anim *,body.no-anim *::before,body.no-anim *::after{animation:none!important}
    body.no-anim .fill{transition:none}
    body.no-orbit .orbit{display:none}
    body.no-float .avatar,body.no-float .float-card,body.no-float .orb{animation:none}
    @media(prefers-reduced-motion:reduce){.rv{opacity:1!important;transform:none!important;filter:none!important}}
  </style>
</head>

<script>
/* =========================================================
   PORTFOLIO RENDERER
   Content = DEFAULTS (site-config.js) + live settings saved
   from admin.html into Supabase. No need to edit this file.
   ========================================================= */
const CACHE_KEY = 'sfh_site_cfg';

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ico = c => { c = String(c || 'fa-solid fa-star').trim(); return c.includes(' ') ? c : 'fa-solid ' + c; };
const safeUrl = u => {
  u = String(u || '').trim();
  if (!u) return '';
  if (/^(#|\/|\.\/|\?)/.test(u)) return u;
  return /^(https?:|mailto:|tel:|data:image\/|data:video\/)/i.test(u) ? u : 'https://' + u;
};
const extAttr = u => /^https?:/i.test(safeUrl(u)) ? 'target="_blank" rel="noopener"' : '';
const fmtDate = d => { const t = new Date(d); return isNaN(t) ? '' : t.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }); };
function readCache() { try { return JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); } catch (e) { return null; } }
function writeCache(c) { try { localStorage.setItem(CACHE_KEY, JSON.stringify(c)); } catch (e) {} }
function hexToRgba(hex, a) {
  const h = String(hex || '#ff5500').replace('#', '');
  const f = h.length === 3 ? h.split('').map(x => x + x).join('') : h.slice(0, 6);
  const n = parseInt(f, 16) || 0;
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}

let sb = null;
try { sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); } catch (e) { console.warn('Supabase not loaded', e); }

const IS_PREVIEW = new URLSearchParams(location.search).has('preview');
let CFG = merge(DEFAULTS, IS_PREVIEW ? null : readCache());
let skillFilter = 'All';
const customById = id => (CFG.customSections || []).find(c => c.id === id);

/* =========================================================
   THEME + ANIMATION SETTINGS
   ========================================================= */
function applyTheme() {
  const t = CFG.theme, r = document.documentElement.style;
  ['primary', 'secondary', 'bg', 'bg2', 'card', 'text', 'muted'].forEach(k => t[k] && r.setProperty('--' + k, t[k]));
  r.setProperty('--radius', (t.radius ?? 18) + 'px');
  r.setProperty('--glow', (t.glow ?? 40) + 'px');
  r.setProperty('--font-h', `'${t.fontHeading}',sans-serif`);
  r.setProperty('--font-b', `'${t.fontBody}',sans-serif`);
  const fams = [...new Set([t.fontHeading, t.fontBody, 'Inter'])].filter(Boolean).map(f => {
    const w = FONT_WEIGHTS[f];
    return 'family=' + f.trim().replace(/ /g, '+') + (w ? ':wght@' + w : '');
  }).join('&');
  const href = `https://fonts.googleapis.com/css2?${fams}&display=swap`;
  if ($('#gfonts').href !== href) $('#gfonts').href = href;
}
function applyAnim() {
  const a = CFG.animations, b = document.body;
  b.dataset.anim = a.reveal || 'fade-up';
  b.classList.toggle('no-anim', !a.enabled);
  b.classList.toggle('no-orbit', !a.orbit);
  b.classList.toggle('no-float', !a.float);
  document.documentElement.style.setProperty('--speed', (a.speed ?? .8) + 's');
  document.documentElement.style.setProperty('--mq', (a.marqueeSpeed ?? 30) + 's');
  $('#cursor-glow').style.display = a.enabled && a.cursorGlow && matchMedia('(pointer:fine)').matches ? 'block' : 'none';
  $('#progress').style.display = a.scrollProgress ? 'block' : 'none';
}
const show = k => CFG.sections[k]?.show !== false;
const st = () => CFG.animations.enabled ? (CFG.animations.stagger ?? .08) : 0;

/* =========================================================
   SOCIAL HELPERS + SECTION VISIBILITY
   ========================================================= */
function socialLinks() {
  const P = CFG.socials.platforms || {};
  return Object.keys(SOCIAL_PLATFORMS).filter(k => P[k] && P[k].enabled && P[k].url)
    .map(k => ({ k, url: P[k].url, ...SOCIAL_PLATFORMS[k] }));
}
function feedPlatforms() {
  const P = CFG.socials.platforms || {};
  return ['youtube', 'instagram', 'facebook', 'tiktok'].filter(k => P[k] && P[k].enabled && P[k].feed);
}
const featuredPosts = () => (CFG.socials.posts || []).filter(p => p && p.url);
const socialHasContent = () => feedPlatforms().length > 0 || featuredPosts().length > 0;

function isVisible(id) {
  const cs = customById(id);
  if (cs) return cs.show !== false;
  if (id === 'social') return show('social') && socialHasContent();
  if (id === 'marquee') return show('marquee') && (CFG.marquee || []).length > 0;
  return show(id);
}
function navItems() {
  const out = [];
  if (show('hero') && CFG.sections.hero.nav) out.push(['home', CFG.sections.hero.nav]);
  orderList(CFG).forEach(id => {
    if (!isVisible(id)) return;
    const cs = customById(id);
    const label = cs ? cs.nav : (CFG.sections[id] || {}).nav;
    if (label) out.push([id, label]);
  });
  return out;
}

/* =========================================================
   RENDERERS — BUILT-IN SECTIONS
   ========================================================= */
function headObj(s) {
  if (!s || (!s.title && !s.accent && !s.kicker)) return '';
  return `<div class="sec-head rv">${s.kicker ? `<span class="kicker">${esc(s.kicker)}</span>` : ''}
    <h2>${esc(s.title)} <span class="grad">${esc(s.accent)}</span></h2>
    ${s.sub ? `<p>${esc(s.sub)}</p>` : ''}<div class="bar-line"></div></div>`;
}
const head = k => headObj(CFG.sections[k] || {});
function avatarInner() {
  const p = CFG.profile;
  return p.photoUrl ? `<img src="${esc(safeUrl(p.photoUrl))}" alt="${esc(p.firstName + ' ' + p.lastName)}" />` : `<span class="monogram">${esc(p.initials || 'S')}</span>`;
}
function renderNav() {
  const p = CFG.profile;
  const brandParts = String(p.brand || '').split(' ');
  $('#brand').innerHTML = `<span class="logo">${esc((p.brand || 'S').charAt(0))}</span><span>${esc(brandParts[0] || '')} <b>${esc(brandParts.slice(1).join(' '))}</b></span>`;
  $('#pl-logo').textContent = (p.brand || 'S').charAt(0);
  const links = navItems().map(([id, l]) => `<a href="#${id}" data-sec="${id}">${esc(l)}</a>`).join('');
  $('#nav-links').innerHTML = links;
  $('#mobile-menu').innerHTML = links + `<a href="#contact" class="btn btn-primary" style="margin-top:8px;justify-content:center">${esc(CFG.nav.cta)}</a>`;
  $('#nav-cta').innerHTML = `${esc(CFG.nav.cta)} <i class="fa-solid fa-arrow-right"></i>`;
}
function socialsHTML() {
  const p = CFG.profile;
  let h = CFG.socials.showHero ? socialLinks().map(l =>
    `<a class="social" style="--pc:${l.color}" href="${esc(safeUrl(l.url))}" target="_blank" rel="noopener" aria-label="${esc(l.name)}" title="${esc(l.name)}"><i class="${l.icon}"></i></a>`).join('') : '';
  if (!CFG.socials.showHero && linkedinUrl(CFG)) h += `<a class="social" href="${esc(safeUrl(linkedinUrl(CFG)))}" target="_blank" rel="noopener" aria-label="LinkedIn"><i class="fa-brands fa-linkedin-in"></i></a>`;
  if (p.email) h += `<a class="social" href="mailto:${esc(p.email)}" aria-label="Email" title="Email"><i class="fa-solid fa-envelope"></i></a>`;
  if (p.whatsapp) h += `<a class="social" style="--pc:#25d366" href="https://wa.me/${esc(p.whatsapp.replace(/\D/g, ''))}" target="_blank" rel="noopener" aria-label="WhatsApp" title="WhatsApp"><i class="fa-brands fa-whatsapp"></i></a>`;
  if (p.phone) h += `<a class="social" href="tel:${esc(p.phone)}" aria-label="Phone" title="Call"><i class="fa-solid fa-phone"></i></a>`;
  return h;
}
function renderHero() {
  const p = CFG.profile, d = st();
  $('#hero-c').innerHTML = `<div class="hero-grid">
    <div>
      <span class="pill rv"><span class="dot"></span>${esc(p.badge)}</span>
      <p class="hello rv" style="--d:${d}s">${esc(p.hello)}</p>
      <h1 class="rv" style="--d:${d * 2}s">${esc(p.firstName)} <span class="grad">${esc(p.lastName)}</span></h1>
      <div class="typer rv" style="--d:${d * 3}s"><span id="typer-text"></span><span class="caret"></span></div>
      <p class="intro rv" style="--d:${d * 4}s">${esc(p.intro)}</p>
      <div class="hero-actions rv" style="--d:${d * 5}s">
        <a href="#contact" class="btn btn-primary">${esc(CFG.nav.cta)} <i class="fa-solid fa-paper-plane"></i></a>
        <button class="btn btn-ghost" onclick="openCV()">View / Print CV <i class="fa-solid fa-file-pdf"></i></button>
      </div>
      <div class="socials rv" style="--d:${d * 6}s"><span class="lbl">Find me on</span>${socialsHTML()}</div>
    </div>
    <div class="hero-visual rv" style="--d:${d * 2}s">
      <div class="avatar-wrap">
        <div class="orbit"><span class="el"></span></div>
        <div class="orbit o2"><span class="el"></span></div>
        <div class="avatar">${avatarInner()}</div>
        ${p.yearsExp ? `<div class="float-card fc1"><div class="num">${esc(p.yearsExp)}</div><small>${esc(p.yearsLabel).replace(' ', '<br>')}</small></div>` : ''}
        ${p.floatBadge ? `<div class="float-card fc2"><i class="fa-solid fa-atom"></i><span>${esc(p.floatBadge)}</span></div>` : ''}
      </div>
    </div></div>`;
}
function renderMarquee() {
  const items = (CFG.marquee || []).map(m => `<span>${esc(m)}</span>`).join('');
  $('#marquee-track').innerHTML = items + items;
  $('#marquee-track').style.animationPlayState = CFG.animations.marquee ? '' : 'paused';
}
function countSpan(value) {
  const a = CFG.animations;
  const num = /^\d+(\.\d+)?$/.test(String(value).trim());
  const counting = num && a.enabled && a.counters;
  return `<span ${counting ? `data-count="${esc(value)}"` : ''}>${counting ? '0' : esc(value)}</span>`;
}
function renderStats() {
  $('#stats-c').innerHTML = CFG.stats.map((s, i) => `<div class="card stat lift rv" style="--d:${i * st()}s"><i class="${esc(ico(s.icon))}"></i>
      <div class="stat-num">${countSpan(s.value)}<b>${esc(s.suffix)}</b></div><p>${esc(s.label)}</p></div>`).join('');
}
function renderAbout() {
  const p = CFG.profile;
  const infos = [
    ['fa-user', 'Full Name', esc(p.firstName + ' ' + p.lastName)],
    ['fa-phone', 'Phone / WhatsApp', p.phone ? `<a href="tel:${esc(p.phone)}">${esc(p.phone)}</a>` : ''],
    ['fa-envelope', 'Email Address', p.email ? `<a href="mailto:${esc(p.email)}">${esc(p.email)}</a>` : ''],
    ['fa-location-dot', 'Location', esc(p.location)]
  ].filter(x => x[2]);
  $('#about-c').innerHTML = head('about') + `<div class="about-grid">
    <div class="rv"><div class="about-photo"><span class="orb b1"></span><span class="orb b2"></span><div class="avatar">${avatarInner()}</div></div></div>
    <div class="about-text">
      <span class="about-tag rv">${esc(p.aboutTag)}</span>
      <h3 class="rv">${esc(p.aboutTitle)}</h3>
      <p class="rv">${esc(p.aboutText1)}</p>
      ${p.aboutText2 ? `<p class="rv">${esc(p.aboutText2)}</p>` : ''}
      <div class="info-grid">${infos.map((x, i) => `<div class="card info rv" style="--d:${i * st()}s"><span class="ib"><i class="fa-solid ${x[0]}"></i></span><div><small>${x[1]}</small><strong>${x[2]}</strong></div></div>`).join('')}</div>
      <div class="btn-row rv"><a href="#contact" class="btn btn-primary">Hire Me <i class="fa-solid fa-arrow-right"></i></a>
      <button class="btn btn-ghost" onclick="openCV()">Download Resume <i class="fa-solid fa-download"></i></button></div>
    </div></div>`;
}
function renderServices() {
  $('#services-c').innerHTML = head('services') + `<div class="services-grid">${CFG.services.map((s, i) => `
    <div class="card service lift tilt rv" style="--d:${i * st()}s"><span class="num-bg">0${i + 1}</span>
      <div class="icon-box"><i class="${esc(ico(s.icon))}"></i></div>
      <h3>${esc(s.title)}</h3><p>${esc(s.desc)}</p>
      <div class="foot"><span>${esc(s.tag)}</span><a href="#contact" class="go" aria-label="Contact"><i class="fa-solid fa-arrow-right"></i></a></div>
    </div>`).join('')}</div>`;
}
function skillBars() {
  const list = skillFilter === 'All' ? CFG.skills : CFG.skills.filter(s => s.category === skillFilter);
  return list.map(s => `<div class="skill"><div class="skill-top"><span>${esc(s.name)}</span><b>${esc(s.percent)}%</b></div>
    <div class="track"><div class="fill" data-w="${Math.max(0, Math.min(100, +s.percent || 0))}"></div></div></div>`).join('');
}
function renderSkills() {
  const cats = ['All', ...new Set(CFG.skills.map(s => s.category).filter(Boolean))];
  if (!cats.includes(skillFilter)) skillFilter = 'All';
  $('#skills-c').innerHTML = head('skills') +
    (cats.length > 2 ? `<div class="tabs rv">${cats.map(c => `<button class="tab ${c === skillFilter ? 'active' : ''}" data-cat="${esc(c)}">${esc(c === 'All' ? 'All Competencies' : c)}</button>`).join('')}</div>` : '') +
    `<div class="card rv"><div class="skills-grid" id="skills-grid">${skillBars()}</div></div>` +
    (CFG.competencies?.length ? `<div class="skill-cloud">${CFG.competencies.map((c, i) => `<span class="rv" style="--d:${i * st() / 2}s">${esc(c)}</span>`).join('')}</div>` : '');
}
function renderExperience() {
  $('#experience-c').innerHTML = head('experience') + `<div class="timeline">${CFG.experience.map((x, i) => `
    <div class="t-item rv" style="--d:${i * st()}s"><span class="dot ${x.current ? 'live' : ''}"></span>
      <div class="card lift tilt">
        <div class="t-top"><span class="chip ${x.current ? 'solid' : ''}">${esc(x.period)}</span><span class="t-type"><i class="${esc(ico(x.icon))}"></i>${esc(x.type)}</span></div>
        <h3>${esc(x.role)}</h3><p class="company">${esc(x.company)}</p>
        <ul class="checks">${(x.points || []).map(pt => `<li><i class="fa-solid fa-circle-check"></i><span>${esc(pt)}</span></li>`).join('')}</ul>
      </div></div>`).join('')}</div>`;
}
function renderEducation() {
  $('#education-c').innerHTML = head('education') + `<div class="edu-grid">
    <div><h3 class="col-title rv"><span><i class="fa-solid fa-graduation-cap"></i></span>Academic Background</h3>
      <div class="stack">${CFG.education.map((e, i) => `<div class="card edu lift rv" style="--d:${i * st()}s">
        <div class="meta"><span class="chip">${esc(e.period)}</span><span>${esc(e.location)}</span></div>
        <h4>${esc(e.degree)}</h4><p class="inst">${esc(e.institute)}</p>${e.desc ? `<p class="d">${esc(e.desc)}</p>` : ''}</div>`).join('')}</div></div>
    <div><h3 class="col-title rv"><span><i class="fa-solid fa-certificate"></i></span>Training & Certifications</h3>
      <div class="stack">${CFG.certifications.map((c, i) => `<div class="card cert lift rv" style="--d:${i * st()}s">
        <div class="ct"><span class="icon-box"><i class="${esc(ico(c.icon))}"></i></span><span class="chip">${esc(c.year)}</span></div>

/* =========================================================
   MEDIA HELPERS (images, uploaded videos, YouTube, Instagram…)
   ========================================================= */
const PLAY = '<span class="fc-play"><i class="fa-solid fa-play"></i></span>';
function mediaEl(u, o = {}) {
  const m = parseMedia(u);
  if (!m) return '';
  if (m.kind === 'image') return `<img src="${esc(m.src)}" alt="${esc(o.alt || '')}" loading="lazy" referrerpolicy="no-referrer">`;
  if (m.kind === 'video') return o.embed
    ? `<video src="${esc(m.src)}" ${o.controls ? 'controls' : 'autoplay muted loop'} playsinline preload="metadata"></video>`
    : `<video src="${esc(m.src)}#t=0.5" muted playsinline preload="metadata"></video>${PLAY}`;
  if (m.kind === 'iframe') {
    if (!o.embed && m.thumb) return `<img class="${m.pl === 'youtube' ? 'yt' : ''}" src="${esc(m.thumb)}" alt="" loading="lazy">${PLAY}`;
    return `<iframe src="${esc(m.src)}" loading="lazy" allow="encrypted-media; picture-in-picture; fullscreen; clipboard-write" allowfullscreen ${m.h ? `style="height:${m.h}px"` : ''}></iframe>`;
  }
  return `<div class="fc-textonly"><i class="fa-solid fa-link"></i></div>`;
}
function lbAttr(u, cap) {
  const m = parseMedia(u);
  if (!m || m.kind === 'link' || (m.kind === 'iframe' && !m.thumb)) return '';
  return `data-lb="${esc(u)}" data-cap="${esc(cap || '')}"`;
}
const tagsHTML = t => { const a = Array.isArray(t) ? t : String(t || '').split(','); const f = a.map(x => String(x).trim()).filter(Boolean); return f.length ? `<div class="tags">${f.map(x => `<span>${esc(x)}</span>`).join('')}</div>` : ''; };
const btnLink = (url, text) => url ? `<a class="link-btn" href="${esc(safeUrl(url))}" ${extAttr(url)}>${esc(text || 'Learn more')} <i class="fa-solid fa-arrow-right"></i></a>` : '';
/** Tiny safe formatter: **bold**, *italic*, [text](url), "- " lists, "## " headings, blank line = paragraph */
function md(s) {
  s = esc(s || '');
  const inline = t => t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/\[([^\]]+)\]\(((?:https?:\/\/|mailto:|tel:|#)[^)\s]*)\)/g, (x, t2, u) => `<a href="${u}" ${/^https?:/.test(u) ? 'target="_blank" rel="noopener"' : ''}>${t2}</a>`);
  return s.split(/\n\s*\n/).map(b => {
    b = b.trim(); if (!b) return '';
    const lines = b.split('\n');
    if (lines.every(l => /^\s*[-•*]\s+/.test(l))) return '<ul>' + lines.map(l => '<li>' + inline(l.replace(/^\s*[-•*]\s+/, '')) + '</li>').join('') + '</ul>';
    if (/^#{2,3}\s/.test(b)) return '<h3>' + inline(b.replace(/^#{2,3}\s/, '')) + '</h3>';
    return '<p>' + inline(b).replace(/\n/g, '<br>') + '</p>';
  }).join('');
}
