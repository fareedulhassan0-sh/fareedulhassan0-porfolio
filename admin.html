<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio Admin Control Center</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = { theme: { extend: { colors: { brand: { orange: '#FF4500', dark: '#08080A', card: '#111116', border: '#1F1F28' } } } } }
  </script>
  <style> body { background-color: #08080A; color: #F3F4F6; } </style>
</head>
<body class="antialiased min-h-screen flex items-center justify-center p-6">

  <!-- LOGIN SCREEN -->
  <div id="loginScreen" class="bg-brand-card border border-brand-border rounded-3xl p-8 max-w-md w-full shadow-2xl">
    <div class="flex items-center gap-4 mb-8">
      <div class="w-12 h-12 rounded-xl bg-brand-orange flex items-center justify-center text-white font-bold text-xl">S</div>
      <div>
        <h2 class="text-xl font-bold">Admin Control Center</h2>
        <p class="text-sm text-gray-400">Syed Fareed Ul Hassan</p>
      </div>
    </div>
    <div class="space-y-5">
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2">Admin Passcode</label>
        <input type="password" id="passcode" placeholder="Enter secure passcode" class="w-full px-4 py-3 rounded-xl bg-brand-dark border border-brand-border focus:border-brand-orange outline-none text-white" />
      </div>
      <button onclick="attemptLogin()" class="w-full py-3 rounded-xl bg-brand-orange text-white font-semibold hover:opacity-90 transition">
        Access Admin Dashboard
      </button>
      <p id="loginError" class="text-red-500 text-sm hidden text-center">Incorrect passcode.</p>
    </div>
  </div>

  <!-- DASHBOARD SCREEN -->
  <div id="dashboardScreen" class="hidden w-full max-w-6xl h-[90vh] flex flex-col">
    <!-- Top Nav -->
    <div class="flex items-center justify-between mb-6 pb-4 border-b border-brand-border">
      <div>
        <h1 class="text-2xl font-bold font-display">Admin Control Center</h1>
        <p class="text-xs text-gray-400 mt-1">Supabase connected to: pxlpfhagbkbafxgcpcyl</p>
      </div>
      <div class="flex gap-3">
        <a href="index.html" class="px-4 py-2 bg-brand-dark border border-brand-border rounded-lg text-sm hover:border-brand-orange transition">View Live Site</a>
        <button onclick="fetchMessages()" class="px-4 py-2 border border-brand-border rounded-lg text-sm flex items-center gap-2 hover:bg-brand-dark"><i data-lucide="refresh-cw" class="w-4 h-4"></i> Refresh</button>
        <button onclick="logout()" class="px-4 py-2 bg-red-500/10 text-red-500 rounded-lg text-sm hover:bg-red-500/20">Logout</button>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 flex-1 min-h-0">
      
      <!-- LEFT: WEBSITE EDITOR (CMS) -->
      <div class="lg:col-span-1 bg-brand-card border border-brand-border rounded-2xl p-6 overflow-y-auto">
        <h2 class="text-xl font-bold mb-6 flex items-center gap-2"><i data-lucide="edit-3" class="w-5 h-5 text-brand-orange"></i> Website Editor</h2>
        
        <div class="space-y-6">
          <div>
            <label class="block text-sm font-semibold text-gray-300 mb-2">Profile Photo</label>
            <input type="file" id="cmsPhotoUpload" accept="image/*" class="block w-full text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-brand-orange file:text-white hover:file:bg-orange-600 transition" />
          </div>

          <div>
            <label class="block text-sm font-semibold text-gray-300 mb-2">Hero Title</label>
            <textarea id="cms_hero_title" rows="2" class="w-full px-3 py-2 rounded-lg bg-brand-dark border border-brand-border outline-none text-sm"></textarea>
          </div>

          <div>
            <label class="block text-sm font-semibold text-gray-300 mb-2">Roles</label>
            <input type="text" id="cms_hero_roles" class="w-full px-3 py-2 rounded-lg bg-brand-dark border border-brand-border outline-none text-sm" />
          </div>

          <div>
            <label class="block text-sm font-semibold text-gray-300 mb-2">Main Description</label>
            <textarea id="cms_hero_desc" rows="4" class="w-full px-3 py-2 rounded-lg bg-brand-dark border border-brand-border outline-none text-sm"></textarea>
          </div>
          
          <div>
            <label class="block text-sm font-semibold text-gray-300 mb-2">About Me Section</label>
            <textarea id="cms_about_text" rows="5" class="w-full px-3 py-2 rounded-lg bg-brand-dark border border-brand-border outline-none text-sm"></textarea>
          </div>

          <button onclick="saveCMSData()" class="w-full py-3 bg-brand-orange text-white rounded-xl font-bold hover:bg-orange-600 transition">Save Changes to Website</button>
          <p id="saveStatus" class="text-emerald-400 text-xs hidden text-center">✅ Saved to homepage!</p>
        </div>
      </div>

      <!-- RIGHT: CLIENT MESSAGES -->
      <div class="lg:col-span-2 bg-brand-card border border-brand-border rounded-2xl p-6 flex flex-col min-h-0">
        <h2 class="text-xl font-bold mb-6 flex items-center gap-2"><i data-lucide="inbox" class="w-5 h-5 text-brand-orange"></i> Client Messages</h2>
        
        <div class="overflow-x-auto flex-1 bg-brand-dark rounded-xl border border-brand-border">
          <table class="w-full text-left text-sm">
            <thead class="bg-brand-card text-xs uppercase text-gray-400 border-b border-brand-border">
              <tr>
                <th class="px-4 py-3">Date</th>
                <th class="px-4 py-3">Client</th>
                <th class="px-4 py-3">Service</th>
                <th class="px-4 py-3">Message</th>
                <th class="px-4 py-3 text-right">Action</th>
              </tr>
            </thead>
            <tbody id="messagesTableBody" class="divide-y divide-brand-border">
              <tr><td colspan="5" class="px-4 py-8 text-center text-gray-500">Loading messages from Supabase...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>

  <script>
    lucide.createIcons();

    // Supabase Initialization
    const SUPABASE_URL = 'https://pxlpfhagbkbafxgcpcyl.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB4bHBmaGFnYmtiYWZ4Z2NwY3lsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4NDcxMjEsImV4cCI6MjEwODQyMzEyMX0.fLsjVzsqy16qe9wsYsF9KStaVKNm9cZDiInf5gsM3ek';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Login Logic
    function attemptLogin() {
      const pass = document.getElementById('passcode').value;
      if (pass === 'fareed2026') {
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('dashboardScreen').classList.remove('hidden');
        loadCMSData();
        fetchMessages();
      } else {
        document.getElementById('loginError').classList.remove('hidden');
      }
    }

    function logout() {
      document.getElementById('dashboardScreen').classList.add('hidden');
      document.getElementById('loginScreen').classList.remove('hidden');
      document.getElementById('passcode').value = '';
    }

    // --- CMS (Website Editor) Logic ---
    document.getElementById('cmsPhotoUpload').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => { localStorage.setItem('sfh_profile_photo', event.target.result); };
      reader.readAsDataURL(file);
    });

    function loadCMSData() {
      const data = localStorage.getItem('portfolio_cms_data');
      if (data) {
        const parsed = JSON.parse(data);
        if(parsed.hero_title) document.getElementById('cms_hero_title').value = parsed.hero_title;
        if(parsed.hero_roles) document.getElementById('cms_hero_roles').value = parsed.hero_roles;
        if(parsed.hero_desc) document.getElementById('cms_hero_desc').value = parsed.hero_desc;
        if(parsed.about_text) document.getElementById('cms_about_text').value = parsed.about_text;
      }
    }

    function saveCMSData() {
      const newData = {
        hero_title: document.getElementById('cms_hero_title').value,
        hero_roles: document.getElementById('cms_hero_roles').value,
        hero_desc: document.getElementById('cms_hero_desc').value,
        about_text: document.getElementById('cms_about_text').value
      };
      localStorage.setItem('portfolio_cms_data', JSON.stringify(newData));
      
      const status = document.getElementById('saveStatus');
      status.classList.remove('hidden');
      setTimeout(() => status.classList.add('hidden'), 3000);
    }

    // --- Supabase Messages Logic ---
    async function fetchMessages() {
      const tbody = document.getElementById('messagesTableBody');
      tbody.innerHTML = '<tr><td colspan="5" class="px-4 py-8 text-center text-brand-orange animate-pulse">Fetching messages...</td></tr>';
      
      try {
        const { data, error } = await supabase.from('contact_messages').select('*').order('created_at', { ascending: false });
        
        if (error) throw error;

        if (data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" class="px-4 py-8 text-center text-gray-500">No messages found yet.</td></tr>';
          return;
        }

        tbody.innerHTML = '';
        data.forEach(msg => {
          const date = new Date(msg.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
          const tr = document.createElement('tr');
          tr.className = 'hover:bg-brand-card/50 transition';
          tr.innerHTML = `
            <td class="px-4 py-3 whitespace-nowrap text-gray-400">${date}</td>
            <td class="px-4 py-3">
              <div class="font-medium text-white">${msg.name}</div>
              <div class="text-xs text-brand-orange">${msg.email}</div>
              ${msg.phone ? `<div class="text-xs text-gray-500">${msg.phone}</div>` : ''}
            </td>
            <td class="px-4 py-3 text-gray-300"><span class="px-2 py-1 bg-brand-card rounded-md text-xs border border-brand-border">${msg.service}</span></td>
            <td class="px-4 py-3"><div class="max-w-xs truncate text-gray-400" title="${msg.message}">${msg.message}</div></td>
            <td class="px-4 py-3 text-right">
              <button onclick='alert("Message:\\n\\n${msg.message.replace(/'/g, "\\'")}")' class="px-3 py-1.5 bg-brand-dark border border-brand-border rounded hover:border-brand-orange text-xs text-white">Read</button>
            </td>
          `;
          tbody.appendChild(tr);
        });
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="5" class="px-4 py-8 text-center text-red-500">Error loading messages: ${err.message}</td></tr>`;
      }
    }
  </script>
</body>
</html>
