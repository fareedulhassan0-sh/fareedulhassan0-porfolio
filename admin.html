<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio Admin Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { brand: { orange: '#FF4500', dark: '#08080A', card: '#111116', border: '#1F1F28' } }
        }
      }
    }
  </script>
  <style>
    body { background-color: #08080A; color: #F3F4F6; }
  </style>
</head>
<body class="antialiased h-screen flex items-center justify-center p-6">

  <!-- LOGIN SCREEN -->
  <div id="loginScreen" class="bg-brand-card border border-brand-border rounded-3xl p-8 max-w-md w-full shadow-2xl">
    <div class="flex items-center gap-4 mb-8">
      <div class="w-12 h-12 rounded-xl bg-brand-orange flex items-center justify-center text-white font-bold text-xl">S</div>
      <div>
        <h2 class="text-xl font-bold">Portfolio Admin Panel</h2>
        <p class="text-sm text-gray-400">Syed Fareed Ul Hassan</p>
      </div>
    </div>
    <div class="space-y-5">
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2">Admin Passcode</label>
        <input type="password" id="passcode" placeholder="Enter secure passcode" class="w-full px-4 py-3 rounded-xl bg-brand-dark border border-brand-border focus:border-brand-orange outline-none" />
      </div>
      <button onclick="attemptLogin()" class="w-full py-3 rounded-xl bg-brand-orange text-white font-semibold hover:opacity-90 transition">
        Access Admin Dashboard
      </button>
      <p id="loginError" class="text-red-500 text-sm hidden text-center">Incorrect passcode.</p>
    </div>
  </div>

  <!-- DASHBOARD SCREEN (Hidden by default) -->
  <div id="dashboardScreen" class="hidden w-full max-w-4xl h-full py-10 flex flex-col">
    <div class="flex items-center justify-between mb-8">
      <h1 class="text-2xl font-bold">Website Editor (CMS)</h1>
      <div class="flex gap-4">
        <a href="index.html" class="px-4 py-2 border border-brand-border rounded-lg text-sm hover:text-brand-orange">View Live Site</a>
        <button onclick="logout()" class="px-4 py-2 bg-red-500/10 text-red-500 rounded-lg text-sm">Logout</button>
      </div>
    </div>

    <div class="bg-brand-card border border-brand-border rounded-2xl p-8 overflow-y-auto flex-1 space-y-8">
      
      <!-- Photo Uploader -->
      <div>
        <h3 class="text-lg font-bold text-brand-orange mb-4 border-b border-brand-border pb-2">Profile Photo</h3>
        <input type="file" id="cmsPhotoUpload" accept="image/*" class="block w-full text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-brand-orange file:text-white hover:file:bg-orange-600 transition" />
        <p class="text-xs text-gray-500 mt-2">Upload a new picture. It will automatically update the homepage.</p>
      </div>

      <!-- Text Content Form -->
      <div>
        <h3 class="text-lg font-bold text-brand-orange mb-4 border-b border-brand-border pb-2">Website Content</h3>
        <div class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-gray-400 mb-1">Hero Title (HTML Allowed)</label>
            <textarea id="cms_hero_title" rows="2" class="w-full px-4 py-3 rounded-xl bg-brand-dark border border-brand-border outline-none">SYED FAREED <br /> <span class="text-gradient">UL HASSAN</span></textarea>
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-400 mb-1">Roles / Tagline</label>
            <input type="text" id="cms_hero_roles" class="w-full px-4 py-3 rounded-xl bg-brand-dark border border-brand-border outline-none" value="<span>Career Expert</span> <span class='text-brand-orange'>•</span> <span>Physics Educator</span>" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-400 mb-1">Main Bio / Description</label>
            <textarea id="cms_hero_desc" rows="4" class="w-full px-4 py-3 rounded-xl bg-brand-dark border border-brand-border outline-none">Career services professional and Physics educator with proven expertise...</textarea>
          </div>
        </div>
      </div>

      <!-- Save Button -->
      <button onclick="saveCMSData()" class="px-8 py-3 bg-brand-orange text-white rounded-xl font-bold hover:bg-orange-600 transition">
        Save & Publish Changes
      </button>
      <p id="saveStatus" class="text-emerald-400 text-sm hidden mt-3">✅ Changes successfully published to website!</p>

    </div>
  </div>

  <script>
    lucide.createIcons();

    // Login Logic
    function attemptLogin() {
      const pass = document.getElementById('passcode').value;
      if (pass === 'fareed2026') {
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('dashboardScreen').classList.remove('hidden');
        loadCMSData(); // Load existing data into form
      } else {
        document.getElementById('loginError').classList.remove('hidden');
      }
    }

    function logout() {
      document.getElementById('dashboardScreen').classList.add('hidden');
      document.getElementById('loginScreen').classList.remove('hidden');
      document.getElementById('passcode').value = '';
    }

    // Photo Upload Logic
    document.getElementById('cmsPhotoUpload').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        localStorage.setItem('sfh_profile_photo', event.target.result);
      };
      reader.readAsDataURL(file);
    });

    // Load Data into Admin Inputs
    function loadCMSData() {
      const data = localStorage.getItem('portfolio_cms_data');
      if (data) {
        const parsed = JSON.parse(data);
        if(parsed.hero_title) document.getElementById('cms_hero_title').value = parsed.hero_title;
        if(parsed.hero_roles) document.getElementById('cms_hero_roles').value = parsed.hero_roles;
        if(parsed.hero_desc) document.getElementById('cms_hero_desc').value = parsed.hero_desc;
      }
    }

    // Save Data to Front-End
    function saveCMSData() {
      const newData = {
        hero_title: document.getElementById('cms_hero_title').value,
        hero_roles: document.getElementById('cms_hero_roles').value,
        hero_desc: document.getElementById('cms_hero_desc').value
      };
      
      localStorage.setItem('portfolio_cms_data', JSON.stringify(newData));
      
      const status = document.getElementById('saveStatus');
      status.classList.remove('hidden');
      setTimeout(() => status.classList.add('hidden'), 3000);
    }
  </script>
</body>
</html>
